          - branch: upload/training/hipaa-training-policy/20260714/151505Z-grace-93b7ca50
            title: Agency staff on a shift of more than four weeks
            summary: Long agency placements were falling between the workforce and contractor rules.
            author: grace
            publish: true
            document:
              title: HIPAA Training Policy
              sections:
                - paragraphs:
                    - All workforce members complete HIPAA privacy and security training within thirty days of hire and annually thereafter.
                    - Contractors with access to production systems complete the same training on the same schedule.
