# Local development seed data.
#
# This file is the whole picture of what `bun run up` puts in front of you.
# Edit it — not tests/seed.ts — when you need another account, another binder,
# another document, or another review state to work against.
#
# How it maps onto the product, which is ADR 0004's four levels:
#   organization → the Gitea org that owns everything and is who we bill
#   groups       → the customer's own reusable teams, granted onto binders
#   binders      → one Gitea repository each: a set of policies governed
#                  together, by the same people, under the same rules
#   folder       → a directory inside that binder, purely a finding aid
#   documents    → a file inside that directory — the record itself
#   changes      → a proposed new version: a branch, a pull request, its reviews
#   publish      → merge the change and tag it as that document's next version
#
# A binder's members are the binder's, not a document's: access is uniform
# within a workspace, which is the whole reason the level exists. `role` maps
# onto the binder's three Gitea teams — admins, authors, reviewers.
#
# A document's status in the list is derived, not declared:
#   no changes                        → Draft
#   an open change, no reviews        → In review
#   an open change asking for work    → Changes requested
#   an open change that is approved   → Ready to publish
#   only published changes            → Published
#
# ---------------------------------------------------------------------------
# What is deliberately in here, and where to find it
#
# The point of this file is that a developer should not have to build a state
# by hand to look at it. Every row below is somewhere in the stack already.
#
#   people
#     site administrator                     alice
#     organization owner who is not one      priya
#     ordinary member                        bob, carol, grace, hugo, ines, omar
#     member of no binder at all             erin
#     member of no organization at all       frank
#     reviewer who can publish nothing       dan
#
#   binders
#     admins only                            hr-investigations
#     admins and authors                     facilities
#     admins, authors and reviewers          safety, clinical, corporate
#     open to the whole organization         safety
#     closed to everyone but its members     hr-investigations, and the rest
#     nothing in it at all                   retired-policies
#     needs two approvals, not one           governance
#     covered in sign-off rules              governance
#     no sign-off rules whatsoever           clinical, and most others
#
#   filing
#     documents at a binder's root           clinical/code-of-conduct
#     one folder deep                        clinical/nursing/…
#     two folders deep                       clinical/nursing/wards/…
#     a folder with nothing in it            clinical/nursing/wards/ward-7
#     a document nobody has published        clinical/administrative/…
#
#   changes
#     out of date by three of its own        corporate/security/access-control-standard
#     out of date behind other work          corporate/finance/purchasing-policy
#     six reviewers asked                    corporate/security/business-continuity-plan
#     many discussions, every one closed     corporate/finance/expenses-policy
#     discussions still open                 corporate/finance/travel-policy
#     moves, renames and rewrites at once    clinical, the open shape change
#     makes folders                          clinical, the published shape change
#     takes a document off the record        corporate, the published archive
#     closed with work still asked for       clinical/nursing/infection-control-policy
#     closed with nobody having asked        clinical/code-of-conduct
#     changes who signs things off           governance, the open sign-off change
#
#   file types
#     the editor's own JSON                  most
#     Markdown                               clinical/administrative/patient-grievance-policy
#     Word                                   clinical/nursing/infection-control-policy
#     PDF                                    clinical/nursing/medication-administration-policy
#
# Re-running the seed is safe: everything below is applied idempotently. The
# one exception is a change made of acts — its commit is a list of moves
# against a particular tree, so the branch is written once and then left alone,
# exactly as a real change request's commit is.

# Every seeded account uses this password. Short on purpose — this stack is
# local-only and never deployed.
password: dev

