                - paragraphs:
                    - We reimburse what was necessary to do the work, at the rates below, against a receipt.
                - heading: Travel
                  paragraphs:
                    - Standard class rail. Mileage at the approved rate where rail is not practical.
                    - First class is reimbursed only where it was cheaper than standard on the day, and the booking confirmation shows it.
                - heading: Subsistence
                  paragraphs:
                    - Up to 6 for breakfast where travel begins before 06:00, up to 25 for an evening meal where the return is after 20:00.
                    - Alcohol is not reimbursed under any heading.
                - heading: Missing receipts
                  paragraphs:
                    - A claim without a receipt is paid once in any twelve months, up to 20, on a signed statement of what was bought.
                - heading: Approval
                  paragraphs:
                    - The claimant's line manager approves. Nobody approves their own claim.
            reviews:
              - by: bob
                state: commented
                body: I have nothing further. Every point I raised is answered above.
            threads:
              - id: first-class-cheaper
                by: bob
                body: "“only where it was cheaper than standard” — cheaper at the time of booking, or cheaper than the standard fare on the day of travel?"
                replies:
                  - by: carol
                    body: At the time of booking, and the confirmation is the evidence. I have said so.
                resolved: true
                resolvedBy: bob
              - id: breakfast-cutoff
                by: dan
                body: Why 06:00 for breakfast? The rest of the sector uses 07:00 and an auditor will ask.
                replies:
                  - by: carol
                    body: Because our first theatre list starts at 07:30 and anybody travelling to it leaves before six. It is deliberate and I would rather write down why.
                  - by: dan
                    body: Good enough for me, as long as the reason is somewhere.
                resolved: true
                resolvedBy: dan
              - id: alcohol-line
                by: alice
                body: Is the alcohol sentence needed? It reads as though somebody has tried.
                replies:
                  - by: carol
                    body: Somebody has tried. It stays.
                resolved: true
                resolvedBy: alice
              - id: missing-receipt-limit
                by: bob
                body: Once in twelve months, up to 20 — is that twelve rolling months or the financial year?
                replies:
                  - by: carol
                    body: Rolling. Changed.
                resolved: true
                resolvedBy: bob
              - id: mileage-rate-where
                by: dan
                body: "“the approved rate” is not defined anywhere in this document. Approved by whom, and where is the number?"
                replies:
                  - by: carol
                    body: It is the HMRC rate and it changes; putting the number here means the policy is wrong every time they move it. The finance intranet page carries the current one and I have linked it.
                  - by: dan
                    body: That works.
                resolved: true
                resolvedBy: dan
              - id: who-approves-the-ceo
                by: alice
                body: Nobody approves their own claim — so who approves mine?
                replies:
                  - by: carol
                    body: The Chair. Added to the approval section.
                resolved: true
                resolvedBy: alice

