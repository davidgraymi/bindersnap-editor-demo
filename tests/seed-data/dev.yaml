      - name: medication-administration-policy
        folder: nursing
        description: Medication administration and error reporting — clinical policy
        format: pdf
        changes:
          - branch: upload/nursing/medication-administration-policy/20251014/143000Z-alice-51ab90c4
            title: Medication Administration Policy — annual review issue
            summary: The 2025 annual review, exported for the survey binder.
            author: alice
            publish: true
            document:
              title: Medication Administration Policy
              sections:
                - heading: Purpose
                  paragraphs:
                    - This policy sets out how medication is prescribed, verified, administered, and documented, and how an error or near miss is reported. It exists so that a patient receives the right medication and so that the clinic learns from every occasion one nearly did not.
                - heading: Scope
                  paragraphs:
                    - This policy applies to every licensed clinician who administers medication and to every workforce member who transcribes, stocks, or wastes it. It applies at all sites, including the mobile unit.
                - heading: Verification Before Administration
                  paragraphs:
                    - The administering clinician confirms the patient identity using two identifiers, then confirms the medication, dose, route, and time against the order before administration.
                    - A second licensed clinician independently verifies insulin, anticoagulants, and chemotherapy before administration. The verification is recorded in the medication record.
                - heading: Storage and Labelling
                  paragraphs:
                    - Medication is stored in a locked cabinet or a locked refrigerator, at the temperature stated on the label, in the original manufacturer's container until the point of administration.
                    - Controlled substances are counted at the start and end of every shift by two licensed clinicians, and any discrepancy is reported to the pharmacy lead the same day.
                - heading: Responsibilities
                  paragraphs:
                    - The pharmacy lead owns this policy, reviews every reported error, and reports themes to the Quality Committee each quarter.
                    - Clinical managers make sure their staff are competent to administer the medication they are assigned and remove from the schedule anyone who is not.
                - heading: Error and Near Miss Reporting
                  paragraphs:
                    - A medication error or near miss is reported in the safety reporting system within twenty-four hours of discovery. Reports are used to improve the process and are not used for discipline unless the conduct was wilful.
                - heading: Records and Retention
                  paragraphs:
                    - Medication records, controlled substance counts, and error reports are retained for six years from the date of the record.
                - heading: Review
                  paragraphs:
                    - This policy is reviewed annually, and sooner if a reported error indicates the policy did not hold.
            reviews:
              - by: bob
                state: approved
                body: Consistent with the pharmacy agreement. Approved.
          - branch: upload/nursing/medication-administration-policy/20260312/091500Z-alice-7d4c22fe
            title: Same-hour error reporting and high-alert storage
            summary: One-hour reporting, opioids added to double-check, and a look-alike clause.
            author: alice
            publish: false
            document:
              title: Medication Administration Policy
              sections:
                - heading: Purpose
                  paragraphs:
                    - This policy sets out how medication is prescribed, verified, administered, and documented, and how an error or near miss is reported. It exists so that a patient receives the right medication and so that the clinic learns from every occasion one nearly did not.
                - heading: Scope
                  paragraphs:
                    - This policy applies to every licensed clinician who administers medication and to every workforce member who transcribes, stocks, or wastes it. It applies at all sites, including the mobile unit.
                - heading: Verification Before Administration
                  paragraphs:
                    - The administering clinician confirms the patient identity using two identifiers, then confirms the medication, dose, route, and time against the order before administration.
                    - A second licensed clinician independently verifies insulin, anticoagulants, opioids, and chemotherapy before administration. The verification is recorded in the medication record.
                - heading: Storage and Labelling
                  paragraphs:
                    - Medication is stored in a locked cabinet or a locked refrigerator, at the temperature stated on the label, in the original manufacturer's container until the point of administration.
                    - Controlled substances are counted at the start and end of every shift by two licensed clinicians, and any discrepancy is reported to the pharmacy lead the same day.
                    - Look-alike and sound-alike medications are separated on the shelf and labelled with tall man lettering. The pharmacy lead maintains the list and reviews it twice a year.
                - heading: Responsibilities
                  paragraphs:
                    - The pharmacy lead owns this policy, reviews every reported error, and reports themes to the Quality Committee each month.
                    - Clinical managers make sure their staff are competent to administer the medication they are assigned and remove from the schedule anyone who is not.
                - heading: Error and Near Miss Reporting
                  paragraphs:
                    - A medication error or near miss is reported in the safety reporting system within one hour of discovery. Reports are used to improve the process and are not used for discipline unless the conduct was wilful.
                - heading: Records and Retention
                  paragraphs:
                    - Medication records, controlled substance counts, and error reports are retained for six years from the date of the record.
                - heading: Review
                  paragraphs:
                    - This policy is reviewed annually, and sooner if a reported error indicates the policy did not hold.
            reviews:
              - by: carol
                state: changes_requested
                body: One hour is right for a wrong-patient event. For a near miss caught before administration it will bury the reporting queue and people will stop filing them.
            threads:
              - id: one-hour-near-miss
                by: carol
                body: Can we split the deadline? One hour when the patient received the medication, end of shift for a near miss that never reached them.
                replies:
                  - by: alice
                    body: The pharmacy lead asked for one number precisely because the old policy had two and nobody could remember which applied.
                  - by: bob
                    body: Two numbers is defensible to a surveyor if the trigger for each is written down. Worth another look before this goes up.
                resolved: false
      - name: patient-grievance-policy
        folder: administrative
        description: Patient complaints and grievances — administrative policy
        format: markdown
        changes:
          - branch: upload/administrative/patient-grievance-policy/20251020/111500Z-alice-6f83a2d1
            title: Patient Grievance Policy — annual review issue
            summary: The 2025 annual review, published to the intranet.
            author: alice
            publish: true
            document:
              title: Patient Grievance Policy
              sections:
                - heading: Purpose
                  paragraphs:
                    - This policy sets out how a patient or their representative raises a concern, how the clinic resolves it, and what the patient is told at each step. A patient who complains is telling us something we would otherwise have to find out from a surveyor.
                - heading: Scope
                  paragraphs:
                    - This policy applies to every concern raised about care, conduct, privacy, or billing, whether it arrives in person, by telephone, by letter, or through the patient portal.
                - heading: Complaint or Grievance
                  paragraphs:
                    - A concern resolved at the point of care by the staff present, to the patient's satisfaction, is a complaint and is logged but not investigated further.
                    - A concern that is not resolved at the point of care, or that alleges harm, abuse, or a privacy breach, is a grievance and enters the process below regardless of how it was raised.
                - heading: Handling a Grievance
                  paragraphs:
                    - The patient experience lead acknowledges a grievance in writing within ten business days of receipt, naming the person who will investigate it.
                    - The investigation is completed and a written response sent within thirty days. The response states the conclusion, any action taken, and the date the grievance was closed.
                - heading: Responsibilities
                  paragraphs:
                    - The patient experience lead owns this policy, maintains the grievance log, and reports themes to the Governing Body each quarter.
                    - Clinical managers investigate grievances about their own service and provide a written account within five business days of being asked.
                - heading: Records and Retention
                  paragraphs:
                    - The grievance log, the investigation file, and the written response are retained for six years from the date the grievance was closed.
                - heading: Review
                  paragraphs:
                    - This policy is reviewed annually, and sooner if a pattern in the log indicates the process did not serve the patient.
            reviews:
              - by: bob
                state: approved
                body: Tracks the conditions of participation. Approved.
          - branch: upload/administrative/patient-grievance-policy/20260318/153000Z-alice-b81f30c7
            title: Faster acknowledgement and the state agency notice
            summary: Five-day acknowledgement, and the patient is told they can go elsewhere.
            author: alice
            publish: false
