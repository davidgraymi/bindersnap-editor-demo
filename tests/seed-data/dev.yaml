            title: Generator testing — first issue
            summary: Monthly on-load test, annual full-load test, and the log.
            author: omar
            publish: true
            document:
              title: Standby Generator Testing
              sections:
                - paragraphs:
                    - The standby generator is tested on load for thirty minutes every month and at full load for four hours every year.
                - heading: The log
                  paragraphs:
                    - Each test is logged with the date, the duration, the load reached and the fuel level before and after.
                - heading: A failed test
                  paragraphs:
