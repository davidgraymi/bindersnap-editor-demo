  # ===========================================================================
  # governance — the binder covered in sign-off rules, and the only one that
  # asks for two approvals. Everything here is gated twice: once by the
  # binder's own rule, once by whichever folder or document rule matches. It is
  # the opposite state to `clinical`, which has no rules at all.
  # ===========================================================================
  - name: governance
    description: The policies that govern the policies — standards, contracts and the rules themselves.
    requiredApprovals: 2
    members:
      - user: alice
        role: admins
      - user: bob
        role: authors
      - user: grace
        role: authors
      - user: ines
        role: authors
      - user: dan
        role: reviewers
    groups:
      - policy-office
      - infection-control
      - legal
      - quality-committee
    # Committed to `main` before it is protected, so these are the rules
    # governing every change below — including, if somebody proposes one, a
    # change to the rules themselves. A group named here must also be granted
    # on the binder, or Gitea holds the merge for an approval its members
    # cannot give.
    signOff:
      - scope: binder
        teams:
          - policy-office
        users: []
      - scope: folder
        target: clinical-standards
        teams:
          - infection-control
        users: []
      - scope: folder
        target: contracts
        teams:
          - legal
        users: []
      - scope: document
        target: contracts/master-services-agreement
        teams:
          - legal
          - quality-committee
        users: []
      # Who signs things off is itself a control, and a control nobody has to
      # approve a change to is not one.
      - scope: rules
        teams:
          - policy-office
        users: []
    documents:
      - name: governance-charter
        description: What the policy manual is for and who owns it
        changes:
          - branch: upload/governance-charter/20250915/100000Z-grace-1a7cd309
            title: Governance charter — first issue
            summary: The manual's purpose, its owner, and how often each policy is looked at.
            author: grace
            publish: true
            document:
              title: Governance Charter
              sections:
                - paragraphs:
                    - This manual is the set of policies the organization holds itself to. A policy that is not in it is not in force.
                - heading: Ownership
                  paragraphs:
                    - The Policy Office owns the manual. Each policy has a named owner who is accountable for it being current.
                - heading: Review cycle
                  paragraphs:
                    - Every policy is reviewed at least every three years, and sooner where the law or an incident requires it.
            reviews:
              - by: alice
                state: approved
                body: This is the document everything else hangs off. Approved.
              - by: priya
                state: approved
                body: Approved. The three-year cycle is what the board agreed.

      - name: hand-hygiene
        folder: clinical-standards
        description: Hand hygiene and personal protective equipment
        format: markdown
        changes:
          - branch: upload/clinical-standards/hand-hygiene/20251002/084500Z-grace-64b1f0aa
            title: Hand hygiene standard — first issue
            summary: The five moments, and what to do when a sink is out of reach.
            author: grace
            publish: true
            document:
              title: Hand Hygiene and PPE
              sections:
                - paragraphs:
                    - Hands are decontaminated at the five moments of hand hygiene, without exception and regardless of whether gloves were worn.
                - heading: When a sink is out of reach
                  paragraphs:
                    - Alcohol gel is used where hands are not visibly soiled. Where they are, or where the patient has a spore-forming infection, soap and water is the only acceptable answer.
            reviews:
              - by: alice
                state: approved
                body: Approved on behalf of the Policy Office.
              - by: ines
                state: approved
                body: Matches what we teach on the ward. Approved.
          - branch: upload/clinical-standards/hand-hygiene/20260216/091000Z-ines-d2f4a716
            title: Add the bare-below-the-elbows requirement
            summary: It has been custom for years and was written down nowhere.
            author: ines
            publish: true
            document:
              title: Hand Hygiene and PPE
              sections:
                - paragraphs:
                    - Hands are decontaminated at the five moments of hand hygiene, without exception and regardless of whether gloves were worn.
                - heading: Dress
                  paragraphs:
                    - Anybody giving direct care is bare below the elbows. No wrist watch, no stoned rings, no long sleeves.
                - heading: When a sink is out of reach
                  paragraphs:
                    - Alcohol gel is used where hands are not visibly soiled. Where they are, or where the patient has a spore-forming infection, soap and water is the only acceptable answer.
            reviews:
              - by: alice
                state: approved
                body: Approved on behalf of the Policy Office.
              - by: grace
                state: approved
                body: Long overdue in writing. Approved.

      - name: sepsis-pathway
        folder: clinical-standards
        description: Recognition and first hour of treatment
        changes:
          - branch: upload/clinical-standards/sepsis-pathway/20251111/141500Z-grace-9e30cb41
            title: Sepsis pathway — first issue
            summary: Screening trigger, the first-hour bundle, and who is called.
            author: grace
            publish: true
            document:
              title: Sepsis Pathway
              sections:
                - paragraphs:
                    - Any patient meeting the screening trigger is escalated immediately and the first-hour bundle is started without waiting for a medical review.
                - heading: The first hour
                  paragraphs:
                    - Blood cultures, lactate, urine output, oxygen, fluids and antibiotics — all six started within sixty minutes of the trigger.
                - heading: Escalation
                  paragraphs:
                    - The on-call registrar is called at the point of triggering, not at the end of the bundle.
            reviews:
              - by: alice
                state: approved
                body: Approved on behalf of the Policy Office.
              - by: ines
                state: approved
                body: The "call at the trigger, not at the end" line is the change that matters. Approved.

      - name: master-services-agreement
        folder: contracts
        description: Our standard terms for a supplier
        format: docx
        changes:
          - branch: upload/contracts/master-services-agreement/20251205/113000Z-grace-3f7a01d2
            title: Master services agreement — 2026 terms
            summary: The standard terms every new supplier contract is written on.
            author: grace
            publish: true
            document:
              title: Master Services Agreement (2026)
              sections:
                - paragraphs:
                    - These terms apply to every supplier contract entered into from 1 January 2026 unless a signed variation says otherwise.
                - heading: Payment
                  paragraphs:
                    - Invoices are payable within thirty days of receipt of a valid invoice.
                - heading: Liability
                  paragraphs:
                    - Liability is capped at the greater of the contract value in the preceding twelve months and 100,000, except for death, personal injury and data protection breaches, where it is uncapped.
                - heading: Data protection
                  paragraphs:
                    - Where the supplier processes personal data on our behalf, the data processing addendum applies and takes precedence over anything inconsistent in these terms.
            reviews:
              - by: bob
                state: approved
                body: Approved. The uncapped carve-outs are the three that matter.
              - by: alice
                state: approved
                body: Approved on behalf of the Policy Office.
              - by: priya
                state: approved
                body: Approved for the Quality Committee.

      - name: data-processing-addendum
        folder: contracts
        description: What a supplier must do with personal data
        format: pdf
        changes:
          - branch: upload/contracts/data-processing-addendum/20260108/095500Z-grace-cc41b0e7
            title: Data processing addendum — 2026 terms
            summary: Subprocessors, retention and what happens at the end of the contract.
            author: grace
            publish: true
            document:
              title: Data Processing Addendum (2026)
              sections:
                - paragraphs:
                    - This addendum applies wherever a supplier processes personal data on our behalf, and it takes precedence over anything inconsistent in the main agreement.
                - heading: Subprocessors
                  paragraphs:
                    - No subprocessor is engaged without thirty days written notice, during which we may object and terminate without penalty.
                - heading: Retention
                  paragraphs:
                    - Personal data is retained only for as long as the service requires it, and is returned or destroyed within thirty days of the contract ending.
                - heading: Breach
                  paragraphs:
                    - We are told of a personal data breach without undue delay and in any event within twenty-four hours of the supplier becoming aware of it.
            reviews:
              - by: bob
                state: approved
                body: Twenty-four hours is tighter than the law asks and we should keep it. Approved.
              - by: alice
                state: approved
                body: Approved on behalf of the Policy Office.

    changes:
      # A change to the sign-off rules themselves — the one kind of change that
      # is about no document at all. It goes on a `sign-off/` branch, and while
      # it is open the rules already in force are the ones governing it.
      - branch: sign-off/20260702094500
        title: Change who signs off on this binder
        summary: >-
          Pharmacy should be on anything in the clinical standards, and the
          contracts folder should not need the whole Policy Office for a typo.
        author: alice
        assignee: priya
        reviewers:
