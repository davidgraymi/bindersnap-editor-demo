    description: Standard data processing agreement
    collaborators:
      - user: bob
        permission: write
      - user: dan
        permission: read
    changes:
      - branch: upload/data-processing-agreement/20260112/084530Z-alice-91de3b77
        title: Standard data processing agreement — first issue
        summary: The template every vendor DPA is cut from.
        author: alice
        publish: true
        document:
          title: Data Processing Agreement
          sections:
            - paragraphs:
                - This agreement governs the processing of personal data by a processor acting on our documented instructions.
            - heading: Subprocessors
              paragraphs:
                - The processor may not engage a subprocessor without prior written authorisation, and remains liable for the subprocessor's performance.
            - heading: Security Measures
              paragraphs:
                - Encryption in transit and at rest, least-privilege access control, and annual penetration testing are minimum requirements.
        reviews:
          - by: bob
            state: approved
            body: Subprocessor and security clauses are both fine. Approved for issue.

