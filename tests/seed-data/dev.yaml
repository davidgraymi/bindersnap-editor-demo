# Local development seed data.
#
# This file is the whole picture of what `docker compose up` puts in front of
# you. Edit it — not tests/seed.ts — when you need another account, another
# document, or another review state to work against.
#
# How it maps onto the product, which is ADR 0004's four levels:
#   organization → the Gitea org that owns everything and is who we bill
#   binders      → one Gitea repository each: a set of policies governed
#                  together, by the same people, under the same rules
#   folder       → a directory inside that binder, purely a finding aid
#   documents    → a file inside that directory — the record itself
#   changes      → a proposed new version: a branch, a pull request, its reviews
#   publish      → merge the change and tag it as that document's next version
#
# A binder's members are the binder's, not a document's: access is uniform
# within a workspace, which is the whole reason the level exists. `role` maps
# onto the binder's three Gitea teams — admins, authors, reviewers.
#
# A document's status in the list is derived, not declared:
#   no changes                        → Draft
#   an open change, no reviews        → In review
#   an open change asking for work    → Changes requested
#   an open change that is approved   → Ready to publish
#   only published changes            → Published
#
# Re-running the seed is safe: everything below is applied idempotently.

# Every seeded account uses this password. Short on purpose — this stack is
# local-only and never deployed.
password: dev
users:
  - username: alice
    fullName: Alice Nguyen
    email: alice@example.com
    role: Compliance manager — owns most documents, site admin
  - username: bob
    fullName: Bob Okafor
    email: bob@example.com
    role: Legal counsel — the reviewer who blocks and approves
  - username: carol
    fullName: Carol Mendes
    email: carol@example.com
    role: Operations lead — owns documents of her own
  - username: dan
    fullName: Dan Whitfield
    email: dan@example.com
    role: External auditor — read-only access, sees but cannot change
# Named so it does not collide with the integration tests, several of which
# create an organization called "Mercy Health" on purpose — including one that
# asserts what happens when two customers of the same name sign up. The seed
# taking that name would make those tests fight the fixture.
organization:
  name: riverside-health
  displayName: Riverside Health
  owner: alice
binders:
