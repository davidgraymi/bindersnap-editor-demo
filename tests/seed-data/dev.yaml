# Local development seed data.
#
# This file is the whole picture of what `docker compose up` puts in front of
# you. Edit it — not tests/seed.ts — when you need another account, another
# document, or another review state to work against.
#
# How it maps onto the product:
#   users      → Bindersnap accounts (all share the password below)
#   documents  → one document repository each
#   changes    → a proposed new version: a branch, a pull request, its reviews
#   publish    → merge the change and tag it as the next published version
#
# A document's status in the workspace list is derived, not declared:
#   no changes                        → Draft
#   an open change, no reviews        → In review
#   an open change asking for work    → Changes requested
#   an open change that is approved   → Ready to publish
#   only published changes            → Published
#
# Re-running the seed is safe: everything below is applied idempotently.

# Every seeded account uses this password. Short on purpose — this stack is
# local-only and never deployed.
password: dev

users:
  - username: alice
    fullName: Alice Nguyen
    email: alice@example.com
    role: Compliance manager — owns most documents, site admin

  - username: bob
    fullName: Bob Okafor
    email: bob@example.com
    role: Legal counsel — the reviewer who blocks and approves

  - username: carol
    fullName: Carol Mendes
    email: carol@example.com
    role: Operations lead — owns documents of her own

  - username: dan
    fullName: Dan Whitfield
    email: dan@example.com
    role: External auditor — read-only access, sees but cannot change

documents:
  # -------------------------------------------------------------------------
  # Changes requested — a reviewer has blocked the open change.
  # -------------------------------------------------------------------------
  - owner: alice
    repo: quarterly-report
    description: Quarterly compliance report
    collaborators:
      - user: bob
        permission: write
      - user: dan
        permission: read
    changes:
      - branch: upload/quarterly-report/20260210/091500Z-alice-4b1c9de2
        title: Q2 amendments — GDPR section update
        summary: Section 4.2 rewritten against the January data protection memo.
        author: alice
        publish: false
        document:
          title: Q2 Compliance Report
          sections:
            - paragraphs:
                - Section 4.2 now reflects the updated GDPR guidance from the January memo.
            - heading: Executive Summary
              paragraphs:
                - All compliance controls are operating within acceptable thresholds. The Q2 audit identified three minor findings, all of which have been remediated.
            - heading: 4.2 Data Retention
              paragraphs:
                - Personal data may be retained for no longer than 24 months unless a longer period is required by law.
                - Retention clocks start at the end of the contractual relationship, not at the date of collection.
        reviews:
          - by: bob
            state: changes_requested
            body: Section 4.2 needs to reference the updated GDPR guidance from the January memo.
        threads:
          - id: retention-clock
            by: bob
            body: Does the 24-month clock start at collection or at the end of the contract? The current wording reads both ways.
            replies:
              - by: alice
                body: End of the contract. I have added a second sentence saying so explicitly.
            resolved: true
            resolvedBy: bob
          - id: legal-hold-exception
            by: bob
            body: We still owe this section a sentence on legal hold. Litigation freezes the retention clock and nothing here says that.
            replies:
              - by: alice
                body: Agreed. Drafting it with outside counsel this week.
            resolved: false

