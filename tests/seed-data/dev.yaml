          - bob
        publish: false
        acts:
          - signOff:
              - scope: binder
                teams:
                  - policy-office
                users: []
              - scope: folder
                target: clinical-standards
                teams:
                  - infection-control
                  - quality-committee
                users: []
              - scope: folder
                target: contracts
                teams:
                  - legal
                users: []
              - scope: document
                target: contracts/master-services-agreement
                teams:
                  - legal
                  - quality-committee
                users: []
              - scope: rules
                teams:
                  - policy-office
                users: []
        threads:
          - id: why-quality-on-standards
            by: bob
            body: Adding the Quality Committee to the clinical standards means four approvals for a wording fix. Is that what we want?
            replies:
              - by: alice
                body: It means two groups, not four people — one approval from each is enough. But you are right that it is slower, and I would rather hear from Priya before this lands.
            resolved: false

  # ===========================================================================
