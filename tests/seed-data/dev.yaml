          - branch: upload/training/hipaa-training-policy/20260408/090210Z-bob-1d77c904
            title: Add the thirty-day deadline for a failed assessment
            summary: Somebody who does not pass has a stated window to sit it again.
            author: bob
            publish: true
            document:
              title: HIPAA Training Policy
              sections:
                - paragraphs:
                    - All workforce members complete HIPAA privacy and security training within thirty days of hire and annually thereafter.
                    - Contractors with access to production systems complete the same training on the same schedule.
                - heading: Assessment
                  paragraphs:
                    - Training ends in an assessment. A score below eighty per cent is a fail.
                    - Somebody who fails sits the assessment again within thirty days. A second fail is raised with their manager.
                - heading: Records
                  paragraphs:
                    - Completion records are retained for six years from the date of training.
                    - Contractor records are held by the engaging manager and produced on request during an audit.
            reviews:
              - by: carol
                state: approved
                body: The second-fail escalation is the part we were missing. Approved.
          - branch: upload/training/hipaa-training-policy/20260519/113340Z-grace-6ae0f1b2
            title: Name the phishing module as part of the annual course
            summary: The security awareness module was being run separately and recorded nowhere.
            author: grace
            publish: true
            document:
