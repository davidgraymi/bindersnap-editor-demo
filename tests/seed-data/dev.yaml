  # -------------------------------------------------------------------------
  # Ready to publish — approved, waiting for someone to press the button.
  # -------------------------------------------------------------------------
  - owner: alice
    repo: incident-response-plan
    description: Security incident response runbook
    collaborators:
      - user: bob
        permission: write
      - user: carol
        permission: write
    changes:
      - branch: upload/incident-response-plan/20260305/101144Z-alice-2c94ef05
        title: Add the 72-hour regulator notification window
        summary: Brings the escalation path in line with the breach notification rule.
        author: alice
        publish: false
        document:
          title: Incident Response Plan
          sections:
            - paragraphs:
                - This plan covers detection, containment, notification, and post-incident review for any confirmed security incident.
            - heading: Notification
              paragraphs:
                - A confirmed personal data breach must be reported to the supervisory authority within 72 hours of discovery.
                - If the 72-hour window cannot be met, the delay and its reasons are recorded in the incident log.
            - heading: Escalation Path
              paragraphs:
                - On-call engineer, then the security lead, then the compliance manager. Legal counsel joins at containment.
        reviews:
