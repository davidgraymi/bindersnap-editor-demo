      - name: infection-control-policy
        folder: nursing
        description: Infection prevention and control — clinical policy
        format: docx
        changes:
          - branch: upload/nursing/infection-control-policy/20251006/091200Z-alice-2c7f41ab
            title: Infection Control Policy — annual review issue
            summary: The 2025 annual review, reissued after the October survey.
            author: alice
            publish: true
            document:
              title: Infection Control Policy
              sections:
                - heading: Purpose
                  paragraphs:
                    - This policy sets out how the clinic prevents and controls the transmission of infection between patients, workforce members, and visitors. It reflects current CDC guidance and the conditions of participation the clinic is surveyed against.
                - heading: Scope
                  paragraphs:
                    - This policy applies to every workforce member, contractor, and student who provides care, handles specimens, or enters a clinical area. It applies at all sites, including the mobile unit.
                - heading: Hand Hygiene
                  paragraphs:
                    - Workforce members perform hand hygiene before and after every patient contact, before any aseptic procedure, and after contact with blood, body fluids, or contaminated surfaces.
                    - Alcohol-based hand rub is the default. Soap and water are used when hands are visibly soiled and after caring for a patient with a spore-forming organism.
                    - The infection preventionist audits hand hygiene compliance quarterly against a minimum of fifty observed opportunities per site.
                - heading: Personal Protective Equipment
                  paragraphs:
                    - Gloves, gowns, masks, and eye protection are worn according to the transmission-based precautions posted for each patient and are removed and discarded inside the patient room before exit.
                    - Respirators are fit-tested on hire and annually thereafter. A workforce member who has not passed a current fit test does not enter an airborne precautions room.
                - heading: Responsibilities
                  paragraphs:
                    - The infection preventionist owns this policy, runs the audit programme, and reports compliance to the Quality Committee each quarter.
                    - Clinical managers correct practice at the point of care and are accountable for their unit's audit results.
                - heading: Training and Competency
                  paragraphs:
                    - Workforce members complete infection control training within thirty days of hire and annually thereafter. Training records are held by the clinical education lead.
                - heading: Records and Retention
                  paragraphs:
                    - Audit results, training records, and exposure reports are retained for six years from the date of the record.
                - heading: Review
                  paragraphs:
                    - This policy is reviewed annually, and sooner if guidance changes or an incident indicates the policy did not hold.
            reviews:
              - by: bob
                state: approved
                body: Matches what we told the surveyor in October. Approved.
          - branch: upload/nursing/infection-control-policy/20260304/104500Z-alice-9be20d15
            title: Tighten hand hygiene auditing and new-hire training
            summary: Monthly audits, fourteen-day training, and point-of-care rub placement.
            author: alice
            publish: false
