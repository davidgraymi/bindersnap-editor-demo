        author: carol
        publish: true
        document:
          title: Vendor Security Review
          sections:
            - paragraphs:
                - Every prospective vendor completes this questionnaire before contract signature. Answers are retained for the life of the relationship.
            - heading: Access Control
              paragraphs:
                - Does the vendor enforce multi-factor authentication for all administrative access to systems holding our data?
            - heading: Incident History
              paragraphs:
                - Has the vendor experienced a reportable security incident in the last thirty-six months?
        reviews:
          - by: alice
            state: approved
            body: Good baseline. Approved.

      - branch: upload/vendor-security-review/20260401/093310Z-carol-e37b1206
        title: Add subprocessor disclosure questions
        summary: Four new questions covering the vendor's own supply chain.
        author: carol
        publish: false
        document:
          title: Vendor Security Review
          sections:
            - paragraphs:
                - Every prospective vendor completes this questionnaire before contract signature. Answers are retained for the life of the relationship.
            - heading: Access Control
              paragraphs:
                - Does the vendor enforce multi-factor authentication for all administrative access to systems holding our data?
            - heading: Incident History
              paragraphs:
                - Has the vendor experienced a reportable security incident in the last thirty-six months?
            - heading: Subprocessors
              paragraphs:
                - Which subprocessors will have access to our data, and in which countries do they operate?
                - How much notice does the vendor give before adding or replacing a subprocessor?
        threads:
