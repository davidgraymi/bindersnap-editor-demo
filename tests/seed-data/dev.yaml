  # reviewers, not open to the organization. The binder that exists to show
  # that "open to everyone" is a switch rather than a law: an HR investigation
  # would be impossible if a staff-wide read were permanent.
  # ===========================================================================
  - name: hr-investigations
    description: Investigation procedure and case handling. Closed to everybody but its administrators.
    members:
      - user: alice
        role: admins
      - user: carol
        role: admins
    groups: []
    documents:
      - name: case-handling-standard
        description: How an investigation is run, recorded and closed
        changes:
          - branch: upload/case-handling-standard/20251030/140000Z-alice-b4c7e209
            title: Case handling standard — first issue
            summary: Appointment, evidence, timescales and who may see the file.
            author: alice
            publish: true
            document:
              title: Case Handling Standard
              sections:
                - paragraphs:
                    - An investigation is commissioned in writing, by a manager with no involvement in the matter, and the terms of reference are given to the subject at the outset.
                - heading: Evidence
                  paragraphs:
                    - Every meeting is recorded in notes agreed with the person spoken to. Nothing goes in the file that the subject has not been shown.
