            reviews:
              - by: alice
                state: approved
                body: Matches the training schedule we already run. Approved.
          - branch: upload/training/hipaa-training-policy/20260226/104455Z-bob-b6c31f4a
            title: Extend training to contractors with system access
            summary: Contractors with production access now sit the same annual training.
            author: bob
            publish: true
            document:
              title: HIPAA Training Policy
