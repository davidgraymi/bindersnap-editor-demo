# The one organization. Everything below belongs to it, which is ADR 0004's
# first level: it is who we bill and who your people are.
organization:
  name: riverside-health
  displayName: Riverside Health
  owner: alice
  # An owner who is not the site administrator. Most of the billing and people
  # screens are written for exactly this person, and the seed could not make
  # one before.
  owners:
    - priya

  # The customer's own groups, reusable across binders. A group is a Gitea team
  # carrying one level, so the level travels with the name — a committee cannot
  # be an editor in one binder and a reviewer in another. A sign-off rule names
  # one of these rather than a list of people.
  groups:
    - name: policy-office
      level: admin
      description: Runs the policy manual. Signs off on the rules themselves.
      members:
        - alice
        - priya

    - name: infection-control
      level: editor
      description: Writes and signs off on the clinical standards.
      members:
        - grace
        - ines

    - name: legal
      level: editor
      description: Signs off on anything contractual.
      members:
        - bob

    - name: quality-committee
      level: reviewer
      description: Reads and approves. Free — a reviewer costs no seat.
      members:
        - priya
        - dan
        - hugo

binders:
  # ===========================================================================
  # clinical — the everyday binder. Documents at every depth, every file type,
  # and one of each review state. It has **no sign-off rules**, which is a real
  # state and the one most binders are in.
  # ===========================================================================
  - name: clinical
    description: Clinical and administrative policies — one set of rules, one set of people.
    members:
      - user: alice
        role: admins
      - user: dan
        role: reviewers
      - user: bob
        role: authors
      - user: carol
        role: authors
      - user: grace
        role: authors
      - user: ines
        role: authors
    groups:
      - quality-committee
    documents:
