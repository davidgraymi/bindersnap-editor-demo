                - heading: Complaint or Grievance
                  paragraphs:
                    - A concern resolved at the point of care by the staff present, to the patient's satisfaction, is a complaint and is logged but not investigated further.
                    - A concern that is not resolved at the point of care, or that alleges harm, abuse, or a privacy breach, is a grievance and enters the process below regardless of how it was raised.
                - heading: Handling a Grievance
                  paragraphs:
                    - The patient experience lead acknowledges a grievance in writing within five business days of receipt, naming the person who will investigate it.
                    - The investigation is completed and a written response sent within thirty days. The response states the conclusion, any action taken, and the date the grievance was closed.
                    - The acknowledgement tells the patient that they may raise the same concern with the state survey agency at any time, and that doing so will not affect their care. The agency's current address and telephone number are held by the patient experience lead.
                - heading: Responsibilities
                  paragraphs:
                    - The patient experience lead owns this policy, maintains the grievance log, and reports themes to the Governing Body each quarter.
                    - Clinical managers investigate grievances about their own service and provide a written account within three business days of being asked.
                - heading: Records and Retention
                  paragraphs:
                    - The grievance log, the investigation file, and the written response are retained for six years from the date the grievance was closed.
                - heading: Review
                  paragraphs:
                    - This policy is reviewed annually, and sooner if a pattern in the log indicates the process did not serve the patient.
            reviews:
              - by: bob
                state: approved
                body: The state agency sentence is the one the last survey asked for in writing. Approved.
            threads:
              - id: three-day-manager-account
                by: carol
                body: Three business days for a manager's written account is tight when the clinician involved is on annual leave. What happens then?
                replies:
                  - by: alice
                    body: The manager writes what they have by day three and says who is still to be spoken to. The clock on the patient's response has not moved.
                resolved: true
                resolvedBy: carol
