# Bindersnap local development stack
# Run: docker compose up
# Copy tests/.env.example to .env before starting the stack.
# See tests/README.md for full usage.
# This is a developer tool. It is never deployed. The Docker Compose config
# uses insecure defaults (fixed passwords, no TLS) that are intentional for
# local speed. Do not use this config as a basis for any production deployment.
#
# Every published port and every container name is configurable so that several
# copies of this stack — one per git worktree — can run side by side. Set
# STACK_NAME plus the *_PORT variables in that worktree's .env.

name: ${STACK_NAME:-bindersnap}

services:
  gitea-init:
    image: alpine:latest
    container_name: ${STACK_NAME:-bindersnap}-gitea-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - ./data/gitea:/data

  gitea:
    image: gitea/gitea:1.27.3
    container_name: ${STACK_NAME:-bindersnap}-gitea
    restart: unless-stopped
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://localhost:${GITEA_PORT:-3000}
      - GITEA__server__HTTP_PORT=${GITEA_PORT:-3000}
      # Gitea >= 1.26 defaults PUBLIC_URL_DETECTION to `auto`, which builds the
      # absolute URLs in API responses (avatar_url, html_url) from the request's
      # own Host header. The API container calls Gitea at http://gitea:3000, so
      # `auto` would hand the browser avatar and comment links pointing at the
      # internal compose hostname, which no browser can resolve. ROOT_URL is set
      # explicitly above and is the only origin the browser can reach, so pin
      # the detection off and always answer with it.
      - GITEA__server__PUBLIC_URL_DETECTION=never
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea.db
      - GITEA__service__DISABLE_REGISTRATION=false
      # ADR 0004: signup creates the organization with the new user's own
      # token, so a new account must be allowed to create one. Gitea's default
      # is already true, but provisioning fails with a bare 403 when it is not
      # — asserted here rather than inherited, so an upgrade cannot silently
      # un-provision every new account.
      - GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - GITEA__admin__DISABLE_REGULAR_ORG_CREATION=false
      - GITEA__cors__ENABLED=true
      - GITEA__cors__ALLOW_DOMAIN=http://localhost:${APP_PORT:-5173}
      - GITEA__cors__METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - GITEA__cors__ALLOW_CREDENTIALS=true
      - GITEA__log__LEVEL=warn
      # Local-only: the seed accounts share the password `dev`. Gitea's
      # default minimum would reject it.
      - GITEA__security__MIN_PASSWORD_LENGTH=3
      - GITEA__security__PASSWORD_COMPLEXITY=off
    ports:
      - "${GITEA_PORT:-3000}:${GITEA_PORT:-3000}"
    volumes:
      - ./data/gitea:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GITEA_PORT:-3000}/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  seed:
    image: oven/bun:1
    container_name: ${STACK_NAME:-bindersnap}-seed
    depends_on:
      gitea:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["bun", "tests/seed.ts"]
    environment:
      - GITEA_URL=http://gitea:${GITEA_PORT:-3000}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-alice}
      - GITEA_ADMIN_PASS=${GITEA_ADMIN_PASS:-dev}
      - APP_PORT=${APP_PORT:-5173}

  hocuspocus:
    build:
      context: .
      dockerfile: services/hocuspocus/Dockerfile
      args:
        HOCUSPOCUS_PORT: ${HOCUSPOCUS_PORT:-1234}
    container_name: ${STACK_NAME:-bindersnap}-hocuspocus
    environment:
      - HOCUSPOCUS_PORT=${HOCUSPOCUS_PORT:-1234}
    ports:
      - "${HOCUSPOCUS_PORT:-1234}:${HOCUSPOCUS_PORT:-1234}"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ${STACK_NAME:-bindersnap}-api
    depends_on:
      gitea:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - API_PORT=${API_PORT:-8787}
      - PORT=${API_PORT:-8787}
      - GITEA_INTERNAL_URL=${GITEA_INTERNAL_URL:-http://gitea:${GITEA_PORT:-3000}}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-alice}
      - GITEA_ADMIN_PASS=${GITEA_ADMIN_PASS:-dev}
      - BINDERSNAP_APP_ORIGIN=http://localhost:${APP_PORT:-5173}
      - BINDERSNAP_USER_EMAIL_DOMAIN=${BINDERSNAP_USER_EMAIL_DOMAIN:-users.bindersnap.local}
      - BINDERSNAP_GITEA_TOKEN_SCOPES=${BINDERSNAP_GITEA_TOKEN_SCOPES:-write:user,write:repository,write:issue,write:organization}
      - BINDERSNAP_REQUIRE_HTTPS=${BINDERSNAP_REQUIRE_HTTPS:-true}
      - BINDERSNAP_AUTH_RATE_LIMIT_ENABLED=${BINDERSNAP_AUTH_RATE_LIMIT_ENABLED:-true}
      - BINDERSNAP_AUTH_RATE_LIMIT_WINDOW_MS=${BINDERSNAP_AUTH_RATE_LIMIT_WINDOW_MS:-600000}
      - BINDERSNAP_AUTH_RATE_LIMIT_MAX=${BINDERSNAP_AUTH_RATE_LIMIT_MAX:-20}
      - BINDERSNAP_DEV_FEATURES=${BINDERSNAP_DEV_FEATURES:-true}
      - BINDERSNAP_SESSIONS_DB_PATH=/var/lib/bindersnap/sessions.db
      - BINDERSNAP_PAYWALL_BYPASS_USERS=${BINDERSNAP_PAYWALL_BYPASS_USERS:-alice,bob,carol,dan}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
    ports:
      - "${API_PORT:-8787}:${API_PORT:-8787}"
    volumes:
      - api-data:/var/lib/bindersnap

  caddy:
    image: caddy:2-alpine
    container_name: ${STACK_NAME:-bindersnap}-caddy
    depends_on:
      api:
        condition: service_started
    environment:
      - API_PORT=${API_PORT:-8787}
      - API_PROXY_PORT=${API_PROXY_PORT:-8788}
    ports:
      - "${API_PROXY_PORT:-8788}:${API_PROXY_PORT:-8788}"
    volumes:
      - ./tests/Caddyfile.integration:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-5173}
    container_name: ${STACK_NAME:-bindersnap}-app
    depends_on:
      api:
        condition: service_started
      gitea:
        condition: service_healthy
      hocuspocus:
        condition: service_started
      seed:
        condition: service_completed_successfully
    environment:
      - APP_PORT=${APP_PORT:-5173}
      - PORT=${APP_PORT:-5173}
      - BUN_PUBLIC_API_BASE_URL=http://localhost:${API_PROXY_PORT:-8788}
      - BUN_PUBLIC_API_URL=http://localhost:${API_PROXY_PORT:-8788}
      - VITE_API_URL=http://localhost:${API_PROXY_PORT:-8788}
      - BUN_PUBLIC_GITEA_URL=http://localhost:${GITEA_PORT:-3000}
      - VITE_GITEA_URL=http://localhost:${GITEA_PORT:-3000}
      - BUN_PUBLIC_HOCUSPOCUS_URL=ws://localhost:${HOCUSPOCUS_PORT:-1234}
      - VITE_HOCUSPOCUS_URL=ws://localhost:${HOCUSPOCUS_PORT:-1234}
      - GITEA_INTERNAL_URL=${GITEA_INTERNAL_URL:-http://gitea:${GITEA_PORT:-3000}}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-alice}
      - GITEA_ADMIN_PASS=${GITEA_ADMIN_PASS:-dev}
    ports:
      - "${APP_PORT:-5173}:${APP_PORT:-5173}"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules

volumes:
  gitea-data:
  app-node-modules:
  api-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: ${STACK_NAME:-bindersnap}-dev
