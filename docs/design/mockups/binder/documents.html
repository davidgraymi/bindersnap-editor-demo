<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Binder · Contents — Bindersnap design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./binder.css" />
    <script src="./shell.js"></script>
  </head>
  <body>
    <script>
      /*
       * The binder, being read. The page is titled with the binder's own name:
       * a binder IS its contents, so this is the one screen where the binder
       * is the subject and the title is rightly its own. A policy and a change
       * request still take the title on their own pages.
       *
       * Every row now answers the question a file list is actually opened
       * with — "what changed, and when" — in the shape somebody already reads
       * one in: the subject of the change that last touched it, linking to
       * that change, and how long ago.
       *
       * The status pills are gone. Four rows each carrying a coloured chip
       * made a list of four policies look like a list of four problems, and
       * "1 open change" is not a property of the policy — it is a property of
       * a change request, which has its own page and its own sidebar entry
       * with the count on it.
       */
      const page = shell({ binder: 'Clinical', section: 'documents' });
      const I = window.bsIcon;

      const folderIcon = `<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3.4l1.3 1.6H15a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5Z"/></svg>`;
      const docIcon = `<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2h5l3 3v11H5V2Z"/><path d="M10 2v3h3"/></svg>`;

      const folder = (name, count) => `
        <button type="button" class="bs-row bs-tree-row bs-tree-row--folder">
          <span class="bs-twisty">${I('chevron', 14)}</span>
          <span class="bs-row-icon">${folderIcon}</span>
          <span class="bs-row-body"><span class="bs-row-name">${name}</span></span>
          <span class="bs-row-right"><span>${count}</span></span>
        </button>`;

      /* Name, then what the last change said, then when — the three columns a
         file list is read in. The subject is the change request's own title,
         shortened, and it links to that change. */
      const policy = (name, subject, change, when) => `
        <button type="button" class="bs-row bs-tree-row" data-depth="1">
          <span class="bs-twisty"></span>
          <span class="bs-row-icon">${docIcon}</span>
          <span class="bs-row-body"><span class="bs-row-name">${name}</span></span>
          <span class="bs-row-subject" style="flex: 1.4; min-width: 0">
            <a href="./change.html" title="${subject}">${subject}</a>
          </span>
          <span class="bs-row-when">${when}</span>
        </button>`;

      page.innerHTML = `
        <div class="bs-pagehead">
          <div class="bs-pagehead-body">
            <h1 class="bs-title">Clinical</h1>
            <p class="bs-subtitle">
              Clinical and administrative policies — one set of rules, one set of people.
            </p>
          </div>
          <div class="bs-pagehead-actions">
            <button type="button" class="bs-btn bs-btn-secondary">Add a policy</button>
            <button type="button" class="bs-btn bs-btn-primary">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6 13.8l-3.2.8.8-3.2 8.6-8.6Z"/></svg>
              Edit
            </button>
          </div>
        </div>

        <div class="bs-panel">
          <div class="bs-panel-bar">
            <input class="bs-input bs-input--sm" style="width: 240px" type="search"
                   placeholder="Filter this binder…" />
            <span class="bs-panel-bar-spacer"></span>
            <span style="color: var(--bs-text-muted); font-size: var(--brand-text-ui-md)">
              4 policies in 3 folders
            </span>
            <span class="bs-segmented">
              <button type="button" class="bs-seg bs-seg--on">Folders</button>
              <button type="button" class="bs-seg">Flat</button>
            </span>
          </div>

          ${folder('Administrative', '1 policy')}
          ${policy('Patient Grievance Policy', 'Five-day acknowledgement, and the patient is told they can go elsewhere', 7, '2 hours ago')}

          ${folder('Nursing', '2 policies')}
          ${policy('Infection Control Policy', 'Monthly audits, fourteen-day training, and point-of-care rub placement', 3, '3 weeks ago')}
          ${policy('Medication Administration Policy', 'One-hour reporting, and opioids added to the double-check', 5, '3 weeks ago')}

          ${folder('Training', '1 policy')}
          ${policy('HIPAA Training Policy', 'Annual refresher moved to the anniversary of hire', 2, '5 months ago')}

          <div class="bs-panel-foot">
            <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4h14v3H2V4Zm1 3v8h12V7M7 10h4"/></svg>
            <button type="button" class="bs-btn bs-btn--quiet bs-btn--sm" style="min-height: 22px; padding: 0">
              2 archived policies
            </button>
          </div>
        </div>`;
    </script>
  </body>
</html>
