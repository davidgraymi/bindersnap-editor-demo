<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Binder · Settings, rules — Bindersnap design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./binder.css" />
    <script src="./shell.js"></script>
  </head>
  <body>
    <script>
      /*
       * Sign-off rules, and the two settings pages behind them, drawn as one
       * scroll so the grammar can be compared against the People screen
       * beside it.
       *
       * What shipped: "SIGN-OFF RULES" as a coral uppercase mono eyebrow, a
       * filled tinted box holding the empty state, then "CHANGE THE RULES" as
       * a second eyebrow with its buttons floating bare on the paper — and on
       * the settings tab, a 380px name field with its Rename button dropped
       * onto the line below it, breaking the one-row-one-control-size rule
       * the product has a test for.
       *
       * Here every block is the same: section heading, panel or fields, note.
       */
      const page = shell({ binder: 'Clinical', section: 'settings' });
      const I = window.bsIcon;

      const nav = (on) => `
        <nav class="bs-subnav-list" aria-label="Binder settings">
          ${[
            ['People', 'people'],
            ['Sign-off rules', 'rules'],
            ['How changes are approved', 'approval'],
            ['Name and description', 'name'],
          ]
            .map(
              ([label, key]) => `<button type="button" class="bs-subnav-item${
                key === on ? ' bs-subnav-item--on' : ''
              }">${label}</button>`,
            )
            .join('')}
        </nav>`;

      page.innerHTML = `
        <div class="bs-pagehead">
          <div class="bs-pagehead-body">
            <h1 class="bs-title">Settings</h1>
            <p class="bs-subtitle">
              One set of rules, one set of people — this is where both are set.
            </p>
          </div>
        </div>

        <div class="bs-subnav">
          ${nav('rules')}

          <div>
            <section class="bs-section">
              <div class="bs-section-head">
                <h2 class="bs-section-title">Sign-off rules</h2>
                <span class="bs-section-count">2</span>
                <span class="bs-section-spacer"></span>
                <button type="button" class="bs-btn bs-btn--sm bs-btn-secondary">Add a rule</button>
              </div>
              <p class="bs-section-note">
                Every change to this binder needs its usual approvals, whatever
                it touches. A sign-off rule adds a second requirement to one
                part of it, so a policy cannot be published without the people
                who own that subject.
              </p>

              <div class="bs-panel">
                <div class="bs-row">
                  <span class="bs-row-icon">
                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3.4l1.3 1.6H15a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5Z"/></svg>
                  </span>
                  <span class="bs-row-body">
                    <span class="bs-row-name">Anything filed in Nursing</span>
                    <span class="bs-row-meta">Signed off by Priya Raman and Tom Vance</span>
                  </span>
                  <span class="bs-row-right">
                    <span class="bs-status bs-status--approved">Enforced</span>
                    <span class="bs-rowacts">
                      <button type="button" class="bs-rowact" aria-label="Edit rule">${I('gear', 14)}</button>
                    </span>
                  </span>
                </div>
                <div class="bs-row">
                  <span class="bs-row-icon">
                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2h5l3 3v11H5V2Z"/><path d="M10 2v3h3"/></svg>
                  </span>
                  <span class="bs-row-body">
                    <span class="bs-row-name">HIPAA Training Policy</span>
                    <span class="bs-row-meta">Signed off by the Compliance group — which has nobody in it</span>
                  </span>
                  <span class="bs-row-right">
                    <!-- A rule that is listed but holding nothing is worse
                         than no rule at all, so the row says so rather than
                         a paragraph above the list saying it about one of
                         them. -->
                    <span class="bs-status bs-status--review">Holding nothing</span>
                    <span class="bs-rowacts">
                      <button type="button" class="bs-rowact" aria-label="Edit rule">${I('gear', 14)}</button>
                    </span>
                  </span>
                </div>
                <div class="bs-panel-foot">
                  Changing these rules is itself a change to the binder, so it
                  goes through the same approval your policies do.
                </div>
              </div>
            </section>

            <section class="bs-section">
              <div class="bs-section-head">
                <h2 class="bs-section-title">How changes are approved</h2>
              </div>

              <div class="bs-panel">
                <div class="bs-row">
                  <span class="bs-row-body">
                    <span class="bs-row-name">Approvals needed before publishing</span>
                    <span class="bs-row-meta">Counted across everyone who can approve here</span>
                  </span>
                  <span class="bs-row-right">
                    <select class="bs-input bs-input--sm" style="width: 80px" aria-label="Approvals needed">
                      <option>1</option><option>2</option><option>3</option>
                    </select>
                  </span>
                </div>
                <div class="bs-row">
                  <span class="bs-row-body">
                    <span class="bs-row-name">A new version clears the approvals already collected</span>
                    <span class="bs-row-meta">On — they were given for different content</span>
                  </span>
                  <span class="bs-row-right">
                    <input type="checkbox" checked style="accent-color: var(--brand-coral); width: 16px; height: 16px" aria-label="Reset approvals on a new version" />
                  </span>
                </div>
                <div class="bs-row">
                  <span class="bs-row-body">
                    <span class="bs-row-name">Every discussion must be resolved before publishing</span>
                    <span class="bs-row-meta">Off — a change can be published with a thread still open</span>
                  </span>
                  <span class="bs-row-right">
                    <input type="checkbox" style="accent-color: var(--brand-coral); width: 16px; height: 16px" aria-label="Block on unresolved threads" />
                  </span>
                </div>
                <div class="bs-panel-foot">
                  These take effect straight away. Who changed each one, and
                  when, is recorded.
                </div>
              </div>
            </section>

            <section class="bs-section">
              <div class="bs-section-head">
                <h2 class="bs-section-title">Name and description</h2>
              </div>
              <div class="bs-fields">
                <div class="bs-field">
                  <label class="bs-field-label" for="binder-name">What this binder is called</label>
                  <!-- One row, one control size. The Rename button belongs
                       beside the field it acts on. -->
                  <div class="bs-field-row">
                    <input class="bs-input" id="binder-name" value="Clinical" />
                    <button type="button" class="bs-btn bs-btn-secondary" disabled>Rename</button>
                  </div>
                  <p class="bs-field-hint">
                    Links to the old name keep working. Nothing filed in the
                    binder moves, and no version changes.
                  </p>
                </div>

                <div class="bs-field">
                  <label class="bs-field-label" for="binder-desc">
                    What it is for <span class="bs-field-optional">— optional</span>
                  </label>
                  <textarea class="bs-input" id="binder-desc" style="min-height: 72px">Clinical and administrative policies — one set of rules, one set of people.</textarea>
                  <p class="bs-field-hint">Shown under the binder's name wherever it is listed.</p>
                </div>
              </div>
            </section>
          </div>
        </div>`;
    </script>
  </body>
</html>
