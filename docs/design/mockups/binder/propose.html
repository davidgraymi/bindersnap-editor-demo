<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Binder · Propose your draft — Bindersnap design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./binder.css" />
    <script src="./shell.js"></script>
  </head>
  <body>
    <script>
      /*
       * Your draft becoming a change request — the customer's "create CR page
       * … so that a user adds a title, description, etc."
       *
       * Three defects it answers:
       *
       * 1. The draft bar stayed on screen above this page carrying a DISABLED
       *    Propose button, so the step had two Propose affordances and the
       *    nearer one was dead. The bar is gone here: this page IS the
       *    propose step.
       * 2. The labels were coral uppercase monospace — `WHAT YOU ARE ASKING
       *    FOR` — a marketing eyebrow standing in for a form label.
       * 3. The acts were prefilled into the description as prose and then
       *    hidden from the author. They are listed beside the form now, as
       *    what is actually being sent, so nobody proposes a draft they have
       *    forgotten the contents of.
       */
      const page = shell({ binder: 'Clinical', section: 'documents' });
      const I = window.bsIcon;

      page.innerHTML = `
        <div class="bs-pagehead">
          <div class="bs-pagehead-body">
            <nav class="bs-crumbs">
              <a href="./documents-editing.html">Your draft</a>
              <span class="bs-crumbs-sep">/</span>
              <span>Propose</span>
            </nav>
            <h1 class="bs-title">Propose your changes</h1>
            <p class="bs-subtitle">
              Three changes, going to the people who sign this binder off.
              Nothing joins the binder until it is approved and published.
            </p>
          </div>
        </div>

        <div class="bs-with-rail">
          <div class="bs-fields" style="max-width: none">
            <!-- Three fields: title, description, reviewers. The hints that
                 were under each one were explaining the form to somebody who
                 had just spent twenty minutes editing the binder it came
                 from; the labels do that work. -->
            <div class="bs-field">
              <label class="bs-field-label" for="cr-title">Title</label>
              <input class="bs-input" id="cr-title"
                     placeholder="Reorganise the nursing policies" />
            </div>

            <div class="bs-field">
              <label class="bs-field-label" for="cr-why">Description</label>
              <textarea class="bs-input" id="cr-why" style="min-height: 140px">The March survey flagged that Medication Administration was filed under Training, where nobody on the nursing team looks for it. Moving it to Nursing, and renaming the folder so it covers midwifery too.</textarea>
            </div>

            <div class="bs-field">
              <label class="bs-field-label">Reviewers</label>
              <div class="bs-panel">
                <!-- Already on the change before it exists, and not removable:
                     the binder's sign-off rules put them there, and Gitea
                     writes the review request itself when the change opens.
                     Showing them here rather than after the fact is what stops
                     "why is Priya on this" being the first reply. -->
                <div class="bs-row" style="min-height: 44px">
                  <span class="bs-avatar bs-avatar--sm bs-avatar--violet">PR</span>
                  <span class="bs-row-body">
                    <span class="bs-row-name">Priya Raman</span>
                    <span class="bs-row-meta">Signs off on Nursing</span>
                  </span>
                  <span class="bs-row-right">
                    <span class="bs-required">
                      <svg width="12" height="12" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3v6l4 2M9 16a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
                      Required
                    </span>
                  </span>
                </div>
                <div class="bs-row" style="min-height: 44px">
                  <span class="bs-avatar bs-avatar--sm bs-avatar--teal">BO</span>
                  <span class="bs-row-body"><span class="bs-row-name">Bob Okafor</span></span>
                  <span class="bs-row-right">
                    <button type="button" class="bs-rowact bs-rowact--danger" style="opacity:1" aria-label="Remove Bob Okafor">
                      <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l8 8M13 5l-8 8"/></svg>
                    </button>
                  </span>
                </div>
                <div class="bs-panel-foot">
                  <select class="bs-input bs-input--sm" style="flex:1" aria-label="Add a reviewer">
                    <option>Ask somebody else to look…</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="bs-field-row" style="margin-top: var(--brand-space-1)">
              <button type="button" class="bs-btn bs-btn-primary">Open the change request</button>
              <button type="button" class="bs-btn bs-btn-secondary">Back to editing</button>
              <span class="bs-section-spacer"></span>
              <button type="button" class="bs-btn bs-btn--quiet">Discard the draft</button>
            </div>
          </div>

          <!-- What is actually in the envelope. It existed only as prefilled
               prose in the description, where an author who had been editing
               for twenty minutes could not check it against what they meant
               to send. -->
          <aside class="bs-rail">
            <div class="bs-panel">
              <div class="bs-panel-bar">
                <span class="bs-section-title" style="font-size: var(--brand-text-ui-md)">What you are sending</span>
                <span class="bs-panel-bar-spacer"></span>
                <span class="bs-section-count">3</span>
              </div>
              <div class="bs-row" style="min-height: 40px">
                <span class="bs-row-icon">${I('change', 14)}</span>
                <span class="bs-row-body"><span class="bs-row-name" style="white-space:normal;font-weight:var(--brand-weight-regular)">Rename the folder Nursing to Nursing and Midwifery</span></span>
              </div>
              <div class="bs-row" style="min-height: 40px">
                <span class="bs-row-icon">${I('change', 14)}</span>
                <span class="bs-row-body"><span class="bs-row-name" style="white-space:normal;font-weight:var(--brand-weight-regular)">Move Medication Administration Policy to Nursing and Midwifery</span></span>
              </div>
              <div class="bs-row" style="min-height: 40px">
                <span class="bs-row-icon">${I('change', 14)}</span>
                <span class="bs-row-body"><span class="bs-row-name" style="white-space:normal;font-weight:var(--brand-weight-regular)">Add the folder Training</span></span>
              </div>
              <div class="bs-panel-foot">
                No policy text changes in this request — only where things are
                filed and what they are called.
              </div>
            </div>
          </aside>
        </div>`;
    </script>
  </body>
</html>
