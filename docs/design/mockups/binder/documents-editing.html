<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Binder · Documents, editing — Bindersnap design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./binder.css" />
    <script src="./shell.js"></script>
  </head>
  <body>
    <script>
      /*
       * The binder, being edited. The screen the customer's whole brief is
       * about — "an edit button that puts the user in edit mode … save
       * everything continuously and when they are ready open a CR."
       *
       * Four things changed from what shipped:
       *
       * 1. The draft bar is a sticky FOOTER, not a tall coral box wedged
       *    between the tabs and the tree. It was pushing the work down the
       *    page and spending the screen's one coral element on a status
       *    message. It now stays reachable at any scroll depth and the page
       *    above it is the binder you came to edit.
       * 2. The header keeps the same buttons in the same places. What
       *    shipped swapped {Add a policy, Edit} for {New folder, Add a
       *    policy} the moment you pressed Edit, so the control under your
       *    cursor changed meaning as you clicked it.
       * 3. Row actions are 28px targets with a visible affordance, not three
       *    14px glyphs at 40% opacity in the far corner.
       * 4. Every row you have touched carries a quiet coral dot, so the draft
       *    is legible on the tree itself and not only in a list of sentences
       *    somewhere else.
       */
      const page = shell({ binder: 'Clinical', section: 'documents' });
      const I = window.bsIcon;

      const acts = `
        <span class="bs-rowacts">
          <button type="button" class="bs-rowact" aria-label="Rename">
            <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6 13.8l-3.2.8.8-3.2 8.6-8.6Z"/></svg>
          </button>
          <button type="button" class="bs-rowact" aria-label="Move">
            <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3.4l1.3 1.6H15a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5Z"/><path d="M7 10h5m-2-2 2 2-2 2"/></svg>
          </button>
          <button type="button" class="bs-rowact bs-rowact--danger" aria-label="Archive">
            <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4h14v3H2V4Zm1 3v8h12V7M7 10h4"/></svg>
          </button>
        </span>`;

      const folderIcon = `<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3.4l1.3 1.6H15a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5Z"/></svg>`;
      const docIcon = `<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2h5l3 3v11H5V2Z"/><path d="M10 2v3h3"/></svg>`;

      const row = ({ depth = 0, kind, name, right = '', meta = '', cls = '', showActs = true }) => `
        <div class="bs-row bs-tree-row ${kind === 'folder' ? 'bs-tree-row--folder' : ''} ${cls}" data-depth="${depth}" draggable="true">
          <span class="bs-twisty">${kind === 'folder' ? I('chevron', 14) : ''}</span>
          <span class="bs-row-icon">${kind === 'folder' ? folderIcon : docIcon}</span>
          <span class="bs-row-body">
            <span class="bs-row-name">${name}</span>
            ${meta ? `<span class="bs-row-meta">${meta}</span>` : ''}
          </span>
          <span class="bs-row-right">${right}</span>
          ${showActs ? acts : ''}
        </div>`;

      page.innerHTML = `
        <div class="bs-pagehead">
          <div class="bs-pagehead-body">
            <h1 class="bs-title">Policies</h1>
            <p class="bs-subtitle">
              Rename in place, drag to refile, make a folder. Everything you do
              is saved to your draft and nobody is asked to look until you
              propose it.
            </p>
          </div>
          <!-- Same buttons, same order, same place as when you are reading.
               Only their state changes: Edit becomes Done. -->
          <div class="bs-pagehead-actions">
            <button type="button" class="bs-btn bs-btn-secondary">Add a policy</button>
            <button type="button" class="bs-btn bs-btn-secondary">Done</button>
          </div>
        </div>

        <div class="bs-panel">
          <div class="bs-panel-bar">
            <button type="button" class="bs-btn bs-btn--sm bs-btn-secondary">
              ${I('plus', 14)} New folder
            </button>
            <button type="button" class="bs-btn bs-btn--sm bs-btn-secondary">
              ${I('doc', 14)} Add a policy
            </button>
            <span class="bs-panel-bar-spacer"></span>
            <!-- Continuous save, said where the eye already is rather than
                 only in the bar at the bottom. There is no Save button and
                 there is not going to be one, so the sentence has to carry
                 the promise the missing button would have. -->
            <span class="bs-saved">
              <svg width="13" height="13" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 7.5 13 14 5"/></svg>
              Saved to your draft
            </span>
          </div>

          ${row({ kind: 'folder', name: 'Administrative', right: '<span>1 policy</span>' })}
          ${row({ depth: 1, kind: 'doc', name: 'Patient Grievance Policy', right: '<span class="bs-ver">v1</span>' })}

          <!-- A folder being renamed. The field IS the row: no dialog, no
               page move, Enter commits and Escape cancels — which is what
               "as simple as Finder" means. -->
          <div class="bs-row bs-tree-row bs-tree-row--folder">
            <span class="bs-twisty">${I('chevron', 14)}</span>
            <span class="bs-row-icon">${folderIcon}</span>
            <input class="bs-rename" value="Nursing and Midwifery" autofocus />
            <span class="bs-rename-hint">Enter to save · Esc to cancel</span>
          </div>

          ${row({ depth: 1, kind: 'doc', name: 'Infection Control Policy', cls: 'bs-row--contested', meta: 'Carol has this open in a change — a rename here will land on her work', right: '<span class="bs-ver">v1</span>' })}
          ${row({ depth: 1, kind: 'doc', name: 'Medication Administration Policy', cls: 'bs-row--dirty', meta: 'Moved here from Training', right: '<span class="bs-ver">v1</span>' })}

          ${row({ kind: 'folder', name: 'Training', right: '<span>Empty</span>' })}

          <!-- Where you drop something to take it out of a folder. Only
               while something is in the air; a permanent strip under every
               binder would be furniture explaining a gesture nobody is
               making. -->
          <div class="bs-drop">Drop here to file it at the top level of the binder</div>
        </div>

        <!-- ── The draft bar ──────────────────────────────────────────────
             Sticky to the bottom of the viewport. Propose is the filled
             button because it is the only thing that finishes the work;
             Discard is quiet and destructive and belongs nowhere near it. -->
        <div class="bs-draftbar">
          <span class="bs-draftbar-mark">
            <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6 13.8l-3.2.8.8-3.2 8.6-8.6Z"/></svg>
          </span>
          <span class="bs-draftbar-body">
            <p class="bs-draftbar-title">3 changes in your draft</p>
            <p class="bs-draftbar-note">
              Rename Nursing to Nursing and Midwifery · Move Medication
              Administration Policy to Nursing · Add the folder Training
            </p>
          </span>
          <button type="button" class="bs-draftbar-toggle">Show all</button>
          <button type="button" class="bs-btn bs-btn--sm bs-btn--quiet">Discard</button>
          <button type="button" class="bs-btn bs-btn--sm bs-btn-primary">Propose these changes</button>
        </div>`;
    </script>
  </body>
</html>
