# Local smoke stack for Stripe webhook proxy verification.
# Starts the real API container behind a disposable Caddy instance so the
# webhook path is exercised through the same forwarded-header contract used in
# production.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - API_PORT=8787
      - PORT=8787
      - NODE_ENV=production
      - GITEA_INTERNAL_URL=http://gitea.invalid
      - BINDERSNAP_GITEA_SERVICE_TOKEN=${BINDERSNAP_GITEA_SERVICE_TOKEN:-gitea_smoke_token}
      - BINDERSNAP_APP_ORIGIN=https://bindersnap.test
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_smoke}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_smoke}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-price_smoke}
      - BINDERSNAP_REQUIRE_HTTPS=true
      - BINDERSNAP_SESSIONS_DB_PATH=/var/lib/bindersnap/sessions.db
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    volumes:
      - webhook-smoke-api-data:/var/lib/bindersnap

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEBHOOK_SMOKE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./tests/Caddyfile.webhook-smoke:/etc/caddy/Caddyfile:ro
      - webhook-smoke-caddy-data:/data
      - webhook-smoke-caddy-config:/config

volumes:
  webhook-smoke-api-data:
  webhook-smoke-caddy-data:
  webhook-smoke-caddy-config:
