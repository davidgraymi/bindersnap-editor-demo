name: Build API Image

# Reusable build for the API container image (GHCR). Sole production caller is
# deploy-pyinfra.yml, which builds the exact commit being deployed (issue #313).
# workflow_dispatch remains for ad-hoc builds (e.g. pre-seeding a rollback tag).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout and build"
        type: string
        required: false
      sha:
        description: "Commit SHA to use for the image tag (defaults to github.sha)"
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image SHA
        run: echo "IMAGE_SHA=${{ inputs.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/bindersnap-api:${{ env.IMAGE_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/bindersnap-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/${IMAGE_OWNER}/bindersnap-api:${IMAGE_SHA}
