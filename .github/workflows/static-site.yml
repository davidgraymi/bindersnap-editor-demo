name: Deploy bindersnap.com and app.bindersnap.com (Cloudflare)

# Builds the app into dist/app and the public site into dist/site
# (scripts/build.ts), and deploys each as the static assets of its own Worker:
# `bindersnap-app` on app.bindersnap.com (apps/app/wrangler.jsonc) and
# `bindersnap-site` on bindersnap.com (wrangler.jsonc).
#
# Needs, in the `production` environment:
#   secret CLOUDFLARE_API_TOKEN  — "Workers Scripts: Edit" on the account and
#                                  "Workers Routes: Edit" + "DNS: Edit" on the
#                                  bindersnap.com zone (the custom domains), nothing else
#   var    CLOUDFLARE_ACCOUNT_ID
#   var    TURNSTILE_SITE_KEY    — public; unset, the app shows no feedback button
#   var    SIGNUP_TURNSTILE_SITE_KEY — public; infra/edge/put-signup-turnstile-secret.sh
#                                  prints it. Unset, signup shows no check, and
#                                  production's API refuses every signup

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - "bun.lock"
      # Infra/deploy-only changes never affect the static site — don't republish.
      - "deploy/**"
      - "infra/**"
      # The feedback Worker deploys itself (feedback-worker.yml).
      - "services/feedback/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bindersnap.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the app and the site
        env:
          BUN_PUBLIC_API_BASE_URL: https://api.bindersnap.com
          # Each origin links to the other (issue #718).
          BUN_PUBLIC_APP_URL: https://app.bindersnap.com
          BUN_PUBLIC_SITE_URL: https://bindersnap.com
          # The Google tag on every page of bindersnap.com (apps/site/analytics.ts),
          # never the app. Unset, there is no tag.
          BINDERSNAP_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # Which build a feedback report came from (apps/app/feedbackTrace.ts).
          BUN_PUBLIC_APP_COMMIT: ${{ github.sha }}
          # Where the Send feedback dialog posts (services/feedback), and its
          # Turnstile widget's public site key, which
          # services/feedback/put-turnstile-secret.sh prints.
          BUN_PUBLIC_FEEDBACK_URL: https://feedback.bindersnap.com/
          # Where the app reports an error nothing caught: the same Worker's
          # /errors route (apps/app/errorReporter.ts). Unset, it reports none.
          BUN_PUBLIC_ERROR_REPORT_URL: https://feedback.bindersnap.com/errors
          BUN_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # The signup form's own widget; the API holds its secret.
          BUN_PUBLIC_SIGNUP_TURNSTILE_SITE_KEY: ${{ vars.SIGNUP_TURNSTILE_SITE_KEY }}
        run: |
          export BUN_PUBLIC_APP_VERSION="$(jq -r .version package.json)"
          bun run build

      - name: Check each origin shipped its headers
        run: |
          test -f dist/app/_headers
          test -f dist/site/_headers
          test -f dist/site/_redirects
          test -f dist/site/404.html
          test -f dist/site/sitemap.xml

      # The app first: a site that links to an app not there yet sends
      # people to an error, an app the site doesn't link to yet harms no one.
      - name: Deploy app.bindersnap.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.149.0 deploy --config apps/app/wrangler.jsonc

      # What search engines were last told, to compare with this build's
      # sitemap after the deploy. None (a first deploy) means every page.
      - name: Save the live sitemap
        run: curl -fsS https://bindersnap.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true

      - name: Deploy bindersnap.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.149.0 deploy

      # IndexNow (scripts/indexnow.ts): Bing and the engines that share with
      # it hear of a new or updated page now instead of on their next crawl.
      # A refusal is worth a red mark but never undoes a deploy.
      - name: Tell search engines which pages changed
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/live-sitemap.xml" ]; then
            bun scripts/indexnow.ts "$RUNNER_TEMP/live-sitemap.xml" dist/site/sitemap.xml
          else
            bun scripts/indexnow.ts --all dist/site/sitemap.xml
          fi
