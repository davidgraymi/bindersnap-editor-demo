name: Deploy bindersnap.com (Cloudflare)

# Builds the public site and the SPA into dist/ and deploys it as the static
# assets of the `bindersnap-site` Worker (wrangler.jsonc). Replaces GitHub Pages.
#
# Needs, in the `production` environment:
#   secret CLOUDFLARE_API_TOKEN  — "Workers Scripts: Edit" on the account and
#                                  "Workers Routes: Edit" + "DNS: Edit" on the
#                                  bindersnap.com zone (the custom domain), nothing else
#   var    CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - "bun.lock"
      # Infra/deploy-only changes never affect the static site — don't republish.
      - "deploy/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bindersnap.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unified SPA
        env:
          BUN_PUBLIC_API_BASE_URL: https://api.bindersnap.com
          # The Google tag on the public site's pages only (apps/site), never
          # the app. Unset, there is no tag. See issue #718.
          BINDERSNAP_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          rm -rf dist
          bun build ./apps/app/index.html \
            --outdir=dist \
            --target=browser \
            --minify \
            --splitting \
            --public-path=/ \
            --define:process.env.NODE_ENV='\"production\"' \
            --env='BUN_PUBLIC_*'
          cp -R apps/app/public/. dist/
          bun scripts/build-help.ts
          bun scripts/build-legal.ts
          bun scripts/build-site.ts

      - name: Check the response headers file shipped
        run: test -f dist/_headers

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.149.0 deploy
