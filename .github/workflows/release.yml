name: Release

on:
  push:
    branches:
      - main
    # The release bump itself carries [skip ci], which GitHub honours, so
    # package.json and bun.lock are not ignored: a dependency bump releases.
    paths-ignore:
      - "CHANGELOG.md"
      # Infra/deploy-only changes don't ship app code — don't cut a release.
      - "deploy/**"
      - "infra/**"
  # Cuts the release a push skipped, e.g. when a merge's message carried a
  # skip marker by accident.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Version
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        run: bun run release

      - name: Read the new version
        id: capture
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # No API image build here: the release-bump commit carries [skip ci], so
      # it is never deployed — production runs the pre-bump commit's image,
      # which deploy-pyinfra.yml builds itself (issue #313). A release-SHA image
      # would never be pulled by anything.
      - name: Push the release commit, then its tag
        run: |
          git push origin main
          # standard-version tags the bump itself unless told not to; tag it
          # here only if it did not.
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null ||
            git tag "v${VERSION}" HEAD
          git push origin "v${VERSION}"
        env:
          VERSION: ${{ steps.capture.outputs.version }}
