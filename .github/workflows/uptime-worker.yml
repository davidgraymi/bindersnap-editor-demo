name: Deploy uptime Worker (Cloudflare)

# Deploys services/uptime as the `bindersnap-uptime` Worker: a cron trigger
# that checks https://api.bindersnap.com/healthz every minute and emails on
# down and up. See docs/adr/0006-cloudflare-workers-at-the-edge.md.
#
# Its one secret (ALERT_TO) is not set here; it is set once by hand
# (services/uptime/README.md) and survives every deploy.
#
# Needs, in the `production` environment (the same ones feedback-worker.yml
# uses):
#   secret CLOUDFLARE_API_TOKEN  — "Workers Scripts: Edit" and
#                                  "Workers KV Storage: Edit" on the account
#   var    CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches:
      - main
    paths:
      - "services/uptime/**"
      - ".github/workflows/uptime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test services/uptime

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.149.0 deploy --config services/uptime/wrangler.jsonc
