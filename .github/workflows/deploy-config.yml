name: Deploy Production Config

on:
  push:
    branches:
      - main
    paths:
      - "docker-compose.prod.yml"
      - "Caddyfile.prod"
      - "litestream.yml"
      - "Dockerfile.caddy"
      - "scripts/bindersnap"
      - "scripts/bootstrap-gitea-service-account.ts"
  workflow_dispatch:
    inputs:
      publish_from_repo:
        description: "Upload the repo-tracked config bundle to S3 before applying it on the host"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production-config
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.12"
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
  DEPLOY_ROLE_ARN: ${{ vars.BINDERSNAP_DEPLOY_ROLE_ARN }}
  DEPLOY_TARGET_TAG_KEY: ${{ vars.BINDERSNAP_DEPLOY_TARGET_TAG_KEY != '' && vars.BINDERSNAP_DEPLOY_TARGET_TAG_KEY || 'Project' }}
  DEPLOY_TARGET_TAG_VALUE: ${{ vars.BINDERSNAP_DEPLOY_TARGET_TAG_VALUE != '' && vars.BINDERSNAP_DEPLOY_TARGET_TAG_VALUE || 'bindersnap' }}
  CONFIG_BUCKET: ${{ vars.BINDERSNAP_CONFIG_BUCKET }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API and ops test suite
        run: bun run test:ops

  deploy:
    name: Deploy Config
    runs-on: ubuntu-24.04
    needs:
      - test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          set -euo pipefail

          missing=0
          for var_name in DEPLOY_ROLE_ARN AWS_REGION DEPLOY_TARGET_TAG_KEY DEPLOY_TARGET_TAG_VALUE CONFIG_BUCKET; do
            value="${!var_name:-}"
            if [ -z "${value}" ]; then
              echo "::error title=Missing workflow configuration::${var_name} is not set"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bindersnap-config-deploy-${{ github.run_id }}

      - name: Publish runtime config bundle to S3
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_from_repo != 'false'
        run: |
          set -euo pipefail

          aws s3 sync ./ "s3://${CONFIG_BUCKET}/" \
            --exclude "*" \
            --include "docker-compose.prod.yml" \
            --include "Caddyfile.prod" \
            --include "litestream.yml" \
            --include "Dockerfile.caddy" \
            --include "scripts/bindersnap" \
            --include "scripts/bootstrap-gitea-service-account.ts"

      - name: Apply runtime config over SSM
        run: |
          set -euo pipefail

          python3 <<'PY' > /tmp/bindersnap-config-ssm-commands.json
          import json
          import os
          import shlex

          bucket = shlex.quote(os.environ["CONFIG_BUCKET"])
          commands = [
              "set -euo pipefail",
              "APP_DIR=/opt/bindersnap",
              f"CONFIG_BUCKET={bucket}",
              (
                  f'if command -v bindersnap-sync-config >/dev/null 2>&1; then '
                  f'CONFIG_BUCKET={bucket} /usr/local/bin/bindersnap-sync-config; '
                  "else "
                  'install -d -m 0755 "$APP_DIR" "$APP_DIR/scripts"; '
                  f'aws s3 sync "s3://{os.environ["CONFIG_BUCKET"]}/" "$APP_DIR/" --exact-timestamps '
                  '--exclude "*" '
                  '--include "docker-compose.prod.yml" '
                  '--include "Caddyfile.prod" '
                  '--include "litestream.yml" '
                  '--include "Dockerfile.caddy" '
                  '--include "scripts/bindersnap" '
                  '--include "scripts/bootstrap-gitea-service-account.ts"; '
                  "fi"
              ),
              'install -m 0755 "$APP_DIR/scripts/bindersnap" /usr/local/bin/bindersnap',
              f"CONFIG_BUCKET={bucket} bindersnap config sync",
              "bindersnap stack validate",
              "bindersnap stack restart",
          ]

          print(json.dumps({"commands": commands}))
          PY

          command_id="$(
            aws ssm send-command \
              --document-name AWS-RunShellScript \
              --targets "Key=tag:${DEPLOY_TARGET_TAG_KEY},Values=${DEPLOY_TARGET_TAG_VALUE}" \
              --comment "Bindersnap config deploy ${GITHUB_SHA}" \
              --parameters file:///tmp/bindersnap-config-ssm-commands.json \
              --max-concurrency 1 \
              --max-errors 0 \
              --timeout-seconds 600 \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "Started SSM command ${command_id}"

          instance_id=""
          for _ in $(seq 1 30); do
            instance_id="$(
              aws ssm list-command-invocations \
                --command-id "${command_id}" \
                --details \
                --query 'CommandInvocations[0].InstanceId' \
                --output text 2>/dev/null || true
            )"

            if [ -n "${instance_id}" ] && [ "${instance_id}" != "None" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "${instance_id}" ] || [ "${instance_id}" = "None" ]; then
            echo "::error title=SSM target not found::No managed instance matched tag ${DEPLOY_TARGET_TAG_KEY}=${DEPLOY_TARGET_TAG_VALUE}"
            exit 1
          fi

          echo "SSM target instance: ${instance_id}"

          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" || true

          invocation_json="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --output json
          )"

          INVOCATION_JSON="${invocation_json}" python3 <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["INVOCATION_JSON"])
          status = payload.get("Status", "Unknown")

          print(f"SSM status: {status}")
          print(f"SSM status details: {payload.get('StatusDetails')}")

          stdout = payload.get("StandardOutputContent", "").strip()
          stderr = payload.get("StandardErrorContent", "").strip()

          if stdout:
              print("\n--- stdout ---")
              print(stdout)

          if stderr:
              print("\n--- stderr ---")
              print(stderr)

          if status != "Success":
              print(f"::error title=SSM config deploy failed::Run Command finished with status {status}")
              sys.exit(1)
          PY
