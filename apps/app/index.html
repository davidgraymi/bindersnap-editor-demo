<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Never inside another site's frame (clickjacking). Cloudflare sends
      X-Frame-Options and frame-ancestors for this page (public/_headers), and
      the page also says it itself, in case it is ever served without them (a
      local build, another host): framed, it hides before it draws anything.
      It also asks to take over the whole tab, which browsers usually refuse a
      cross-site frame, so hiding is the part that counts. First in <head> so
      it runs before any paint. A frame sandboxed against scripts stops this,
      but it stops the app too, so there is nothing in it to click.
    -->
    <script>
      if (window.self !== window.top) {
        document.documentElement.style.display = "none";
        try {
          window.top.location.replace(window.self.location.href);
        } catch (e) {
          // A sandboxed frame may not navigate its parent; hidden is enough.
        }
      }
    </script>
    <title>Bindersnap</title>
    <!--
      The app, at app.bindersnap.com: nothing here for a search engine. The
      public site, at bindersnap.com, is apps/site. public/robots.txt says the
      same to crawlers that never load the page.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      The <link> hrefs are relative so Bun bundles them; the build also copies
      public/ to the root, where browsers look for /favicon.ico.
    -->
    <link rel="icon" href="./public/favicon.ico" sizes="48x48" />
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="manifest" href="./public/site.webmanifest" />
    <meta
      name="theme-color"
      content="#fafaf7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c1917"
      media="(prefers-color-scheme: dark)"
    />
    <!--
      Our own copy of the fonts, not Google's: see public/fonts/fonts.css. An
      @import, so the bundler leaves it alone instead of inlining every font
      file into the app's stylesheet.
    -->
    <style>
      @import url("/fonts/fonts.css");
    </style>
    <link rel="stylesheet" href="@ui/css" />
    <script>
      (function () {
        var s = null;
        try {
          s = localStorage.getItem("bs-theme");
        } catch (e) {
          // Storage refused (private browsing): follow the system.
        }
        var p = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          s || (p ? "dark" : "light"),
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
