# Bindersnap production stack (EC2 deployment)
# Run on the EC2 host: docker compose -f docker-compose.prod.yml --env-file /opt/bindersnap/.env.prod up -d
#
# The /opt/bindersnap/.env.prod file is rendered on every pyinfra deploy
# (deploy/deploy.py) from /bindersnap/prod/* in SSM Parameter Store.
# For local dry runs, point --env-file at a copy of .env.prod.example.
#
# This file is standalone — it does NOT extend docker-compose.yml.
# The dev compose must never be used for production.

services:
  gitea-init:
    image: alpine:latest
    container_name: bindersnap-gitea-init-prod
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - gitea-data:/data
    restart: "no"

  gitea:
    # The same pinned 28.0.0 as the repository's own `docker-compose.yml`;
    # change both in one commit. A Gitea upgrade migrates `gitea.db` on start
    # and cannot be reverted by reverting this line — see docs/ops/deploy.md,
    # "Gitea version changes are not covered by a git revert".
    image: gitea/gitea:28.0.0@sha256:a9dc25679ebdd33356242d2e0667cc220043745e8339922879f187c20329a42e
    container_name: bindersnap-gitea-prod
    restart: unless-stopped
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # --- Server ---
      # A name only: nothing serves gitea.bindersnap.com (see Caddyfile.prod).
      # Gitea builds the absolute URLs in its API answers from it, and the API
      # never hands those to the browser.
      - GITEA__server__ROOT_URL=https://gitea.bindersnap.com
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DISABLE_SSH=true
      # Gitea >= 1.26 defaults PUBLIC_URL_DETECTION to `auto`, which builds the
      # absolute URLs in API responses (avatar_url, html_url) from the request's
      # own Host header. The API container calls Gitea at http://gitea:3000
      # without an X-Forwarded-Proto, so `auto` would hand the browser avatar
      # and comment links pointing at http://gitea:3000. `never` keeps the
      # pre-1.26 behaviour of this stack: always answer with ROOT_URL.
      - GITEA__server__PUBLIC_URL_DETECTION=never
      # --- Database ---
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea.db
      # WAL, stated here rather than inherited. Litestream switches gitea.db to
      # WAL when it starts (it needs it to replicate), which is the only reason
      # prod ran in WAL before this line — so removing or delaying the sidecar
      # silently dropped Gitea back to the rollback journal, where concurrent
      # API calls convoy on the write lock. Dev sets the same.
      - GITEA__database__SQLITE_JOURNAL_MODE=WAL
      # --- Service (registration disabled) ---
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=false
      - GITEA__service__ENABLE_CAPTCHA=false
      # ADR 0004: signup creates the organization with the new user's own
      # token, so a new account must be allowed to create one. Gitea's default
      # is already true, but provisioning fails with a bare 403 when it is not
      # — asserted here rather than inherited, so an upgrade cannot silently
      # un-provision every new account.
      - GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - GITEA__admin__DISABLE_REGULAR_ORG_CREATION=false
      # --- CORS ---
      # Off: no browser calls Gitea, so no origin needs to.
      - GITEA__cors__ENABLED=false
      # --- Logging ---
      # No Gravatar or other outside avatar service: Gitea draws its own, so no
      # hash of anybody's email leaves the host (the Privacy Policy says so).
      - GITEA__picture__DISABLE_GRAVATAR=true
      - GITEA__picture__ENABLE_FEDERATED_AVATAR=false
      - GITEA__log__LEVEL=warn
      - GITEA__log__MODE=console
      # --- Security ---
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      # --- Disable unused auth ---
      - GITEA__mailer__ENABLED=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__oauth2__ENABLE=false
      # --- Admin credentials (first-boot only) ---
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-}
      - GITEA_ADMIN_PASS=${GITEA_ADMIN_PASS:-}
    volumes:
      - gitea-data:/data
    # Loopback only, never the public interface: this is how an operator
    # reaches the admin UI, through an SSM port-forwarding session to the host
    # (docs/ops/break-glass.md, "Reaching Gitea").
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    # API_TAG is pinned to the deployed commit's SHA by the pyinfra deploy
    # (issue #313); it renders into .env.prod. `:latest` is only the fallback
    # for a host that predates the pin or a manual `docker compose` invocation.
    image: ghcr.io/davidgraymi/bindersnap-api:${API_TAG:-latest}
    container_name: bindersnap-api-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /bindersnap/api
        awslogs-region: "${AWS_REGION:-us-east-1}"
        awslogs-create-group: "true"
        tag: "api/{{.Name}}"
    environment:
      - API_PORT=8787
      - PORT=8787
      - NODE_ENV=production
      - GITEA_INTERNAL_URL=http://gitea:3000
      - BINDERSNAP_GITEA_SERVICE_TOKEN=${GITEA_SERVICE_TOKEN:?set in the generated env file}
      # Empty until the deploy mints it; the API then uses the service token.
      - BINDERSNAP_GITEA_ADMIN_TOKEN=${GITEA_ADMIN_TOKEN:-}
      - BINDERSNAP_APP_ORIGIN=https://bindersnap.com
      - BINDERSNAP_API_ORIGIN=https://api.bindersnap.com
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set in the generated env file}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?set in the generated env file}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:?set in the generated env file}
      - BINDERSNAP_REMEMBER_ME_SESSION_TTL_MS=${BINDERSNAP_REMEMBER_ME_SESSION_TTL_MS:-2592000000}
      # Host-only: the session cookie goes to api.bindersnap.com and nowhere
      # else. The SPA calls the API with `credentials: "include"`, and
      # bindersnap.com and api.bindersnap.com are the same site, so SameSite=Lax
      # still sends it. With `Domain=.bindersnap.com` it also went to the static
      # host and every other subdomain, and any of them could set a cookie that
      # shadowed it. The `__Host-` prefix makes the browser enforce all of that:
      # it refuses the cookie unless it is Secure, Path=/ and has no Domain.
      - BINDERSNAP_SESSION_COOKIE_NAME=__Host-bindersnap_session
      - BINDERSNAP_SESSION_COOKIE_DOMAIN=
      - BINDERSNAP_SESSION_COOKIE_SAME_SITE=${BINDERSNAP_SESSION_COOKIE_SAME_SITE:-Lax}
      - BINDERSNAP_USER_EMAIL_DOMAIN=${BINDERSNAP_USER_EMAIL_DOMAIN:-users.bindersnap.com}
      - BINDERSNAP_GITEA_TOKEN_SCOPES=${BINDERSNAP_GITEA_TOKEN_SCOPES:-write:user,write:repository,write:issue,write:organization}
      - BINDERSNAP_REQUIRE_HTTPS=true
      - BINDERSNAP_AUTH_RATE_LIMIT_ENABLED=true
      - BINDERSNAP_SESSIONS_DB_PATH=/var/lib/bindersnap/sessions.db
      # --- Email (issue #665) ---
      # The API sends through Amazon SES with the instance role (infra/email);
      # there is no mail secret. Off until the domain verifies: set the SSM
      # leaf `mail_transport` to `ses` and redeploy. While off, emails queue
      # in the outbox and wait.
      - BINDERSNAP_MAIL_TRANSPORT=${MAIL_TRANSPORT:-off}
      - BINDERSNAP_MAIL_FROM=${MAIL_FROM:-Bindersnap <notifications@bindersnap.com>}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - api-data:/var/lib/bindersnap

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: bindersnap-caddy-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
      api:
        condition: service_started
    # No published ports: requests reach Caddy only from cloudflared, over
    # the Docker network (see Caddyfile.prod).
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # The only way in. cloudflared dials out to Cloudflare and carries
  # api.bindersnap.com's requests back to Caddy; the tunnel's routes live in
  # Cloudflare (infra/edge). The token is the SSM leaf `cloudflare_tunnel_token`,
  # written by infra/edge/put-tunnel-token.sh, never by Terraform.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: bindersnap-cloudflared-prod
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set in the generated env file}
    healthcheck:
      test:
        ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  litestream:
    # Pinned: a floating tag let a backup-agent upgrade ride along with any
    # deploy. scripts/restore.sh restores with the same image; bump both.
    image: litestream/litestream:0.3.14@sha256:c5a1e1b01916b3a110f6600820ef176d048d9b9c2411ef0a680de0caa68934a5
    container_name: bindersnap-litestream-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
      api:
        condition: service_started
    command: ["replicate"]
    volumes:
      - gitea-data:/data/gitea
      - api-data:/data/api
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - LITESTREAM_S3_BUCKET=${LITESTREAM_S3_BUCKET:?set in the generated env file}

volumes:
  gitea-data:
  api-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: bindersnap-prod
