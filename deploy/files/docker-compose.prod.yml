# Bindersnap production stack (EC2 deployment)
# Run on the EC2 host: docker compose -f docker-compose.prod.yml --env-file /opt/bindersnap/.env.prod up -d
#
# The /opt/bindersnap/.env.prod file is rendered on every pyinfra deploy
# (deploy/deploy.py) from /bindersnap/prod/* in SSM Parameter Store.
# For local dry runs, point --env-file at a copy of .env.prod.example.
#
# This file is standalone — it does NOT extend docker-compose.yml.
# The dev compose must never be used for production.

services:
  gitea-init:
    image: alpine:latest
    container_name: bindersnap-gitea-init-prod
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - gitea-data:/data
    restart: "no"

  gitea:
    image: gitea/gitea:1.27.3
    container_name: bindersnap-gitea-prod
    restart: unless-stopped
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # --- Server ---
      - GITEA__server__ROOT_URL=https://gitea.bindersnap.com
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DISABLE_SSH=true
      # Gitea >= 1.26 defaults PUBLIC_URL_DETECTION to `auto`, which builds the
      # absolute URLs in API responses (avatar_url, html_url) from the request's
      # own Host header. The API container calls Gitea at http://gitea:3000
      # without an X-Forwarded-Proto, so `auto` would hand the browser avatar
      # and comment links pointing at http://gitea:3000. `never` keeps the
      # pre-1.26 behaviour of this stack: always answer with ROOT_URL.
      - GITEA__server__PUBLIC_URL_DETECTION=never
      # --- Database ---
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea.db
      # --- Service (registration disabled) ---
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=false
      - GITEA__service__ENABLE_CAPTCHA=false
      # ADR 0004: signup creates the organization with the new user's own
      # token, so a new account must be allowed to create one. Gitea's default
      # is already true, but provisioning fails with a bare 403 when it is not
      # — asserted here rather than inherited, so an upgrade cannot silently
      # un-provision every new account.
      - GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - GITEA__admin__DISABLE_REGULAR_ORG_CREATION=false
      # --- CORS ---
      - GITEA__cors__ENABLED=true
      - GITEA__cors__ALLOW_DOMAIN=https://bindersnap.com
      - GITEA__cors__METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - GITEA__cors__ALLOW_CREDENTIALS=true
      # --- Logging ---
      - GITEA__log__LEVEL=warn
      - GITEA__log__MODE=console
      # --- Security ---
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      # --- Disable unused auth ---
      - GITEA__mailer__ENABLED=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__oauth2__ENABLE=false
      # --- Admin credentials (first-boot only) ---
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-}
      - GITEA_ADMIN_PASS=${GITEA_ADMIN_PASS:-}
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    # API_TAG is pinned to the deployed commit's SHA by the pyinfra deploy
    # (issue #313); it renders into .env.prod. `:latest` is only the fallback
    # for a host that predates the pin or a manual `docker compose` invocation.
    image: ghcr.io/davidgraymi/bindersnap-api:${API_TAG:-latest}
    container_name: bindersnap-api-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /bindersnap/api
        awslogs-region: "${AWS_REGION:-us-east-1}"
        awslogs-create-group: "true"
        tag: "api/{{.Name}}"
    environment:
      - API_PORT=8787
      - PORT=8787
      - NODE_ENV=production
      - GITEA_INTERNAL_URL=http://gitea:3000
      - BINDERSNAP_GITEA_SERVICE_TOKEN=${GITEA_SERVICE_TOKEN:?set in the generated env file}
      - BINDERSNAP_APP_ORIGIN=https://bindersnap.com
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?set in the generated env file}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?set in the generated env file}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:?set in the generated env file}
      - BINDERSNAP_REMEMBER_ME_SESSION_TTL_MS=${BINDERSNAP_REMEMBER_ME_SESSION_TTL_MS:-2592000000}
      - BINDERSNAP_SESSION_COOKIE_DOMAIN=${BINDERSNAP_SESSION_COOKIE_DOMAIN:-.bindersnap.com}
      - BINDERSNAP_SESSION_COOKIE_SAME_SITE=${BINDERSNAP_SESSION_COOKIE_SAME_SITE:-Lax}
      - BINDERSNAP_USER_EMAIL_DOMAIN=${BINDERSNAP_USER_EMAIL_DOMAIN:-users.bindersnap.com}
      - BINDERSNAP_GITEA_TOKEN_SCOPES=${BINDERSNAP_GITEA_TOKEN_SCOPES:-write:user,write:repository,write:issue,write:organization}
      - BINDERSNAP_REQUIRE_HTTPS=true
      - BINDERSNAP_AUTH_RATE_LIMIT_ENABLED=true
      - BINDERSNAP_SESSIONS_DB_PATH=/var/lib/bindersnap/sessions.db
    volumes:
      - api-data:/var/lib/bindersnap

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: bindersnap-caddy-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  litestream:
    image: litestream/litestream:0.3
    container_name: bindersnap-litestream-prod
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
      api:
        condition: service_started
    command: ["replicate"]
    volumes:
      - gitea-data:/data/gitea
      - api-data:/data/api
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - LITESTREAM_S3_BUCKET=${LITESTREAM_S3_BUCKET:?set in the generated env file}

volumes:
  gitea-data:
  api-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: bindersnap-prod
