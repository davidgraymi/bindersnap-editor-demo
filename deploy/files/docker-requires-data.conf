# Installed by deploy/deploy.py as docker.service.d/10-bindersnap-data.conf.
# Docker's data-root (/data/docker) lives on the EBS data volume, which fstab
# mounts with `nofail`. Order Docker after that mount and refuse to start
# without it, rather than let it create an empty data-root on the root disk.
[Unit]
RequiresMountsFor=/data
